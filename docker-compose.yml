# WorkBuddy Manager —— Docker Compose 部署
#
# 用法：
#   1) 按需修改下面的环境变量（至少确认上游地址与路径）
#   2) docker compose up -d --build
#   3) 浏览器打开 http://<服务器IP>:7864
#      首次启动若未设 WB_ADMIN_PASSWORD，会随机生成密码并打印到容器日志：
#      docker compose logs workbuddy-manager | grep -A2 密码
#
# 与宿主机安装（deploy/install.sh + systemd）的区别，见 Dockerfile 顶部说明。
# 简述：生产默认采用最小权限容器，不挂 docker.sock，也不把宿主 Docker 控制权
# 暴露给面板。上游重载、日志和更新请在宿主机执行受控运维命令，面板会明确提示。

services:
  workbuddy-manager:
    build:
      context: .
      args:
        # 可选：PyPI 镜像（成因同上——官方源走国际 CDN，国内会抖动/失败）。
        # 留空 = 官方源，失败时 Dockerfile 会自动降级到清华镜像重试。
        # 可选镜像：https://pypi.tuna.tsinghua.edu.cn/simple / https://mirrors.aliyun.com/pypi/simple
        PIP_INDEX_URL: ""
        # 可选：npm 依赖镜像。**只在需要容器内构建前端时用得上**（即工作区
        # 没有 web/out 的情况，如 git clone 部署）。成因与上面两个相同——
        # 官方 registry 国内访问慢且会断。
        #   docker compose build --build-arg NPM_REGISTRY=https://registry.npmmirror.com
        NPM_REGISTRY: ""
        # 可选：子路径部署前缀（如 /workbuddy-manager）。留空 = 部署在根路径。
        #
        # 容器版的前端是**构建期**编译进镜像的，所以前缀必须在 build 时传进来；
        # 与下面 environment 里的 WB_BASE_PATH 取值必须一致。
        #   docker compose build --build-arg BASE_PATH=/workbuddy-manager
        BASE_PATH: ""
    image: workbuddy-manager:latest
    container_name: workbuddy-manager
    # 这个 restart 策略是容器版「一键更新」能生效的前提：
    # 更新完成后容器内的进程会退出，靠它用新代码重新拉起。
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 首启管理员密码；不设则随机生成并打印到日志（推荐首启后立即改）
      # WB_ADMIN_PASSWORD: "改成你的强密码"
      # 上游地址：若上游与本品在同一 compose 网络，用服务名；否则填宿主机地址
      #   - 同网络（推荐）：http://workbuddy2api:7863
      #   - 用宿主机 Docker 网关：http://host.docker.internal:7863
      WB2API_BASE: http://host.docker.internal:7863
      # 可选：子路径部署前缀，必须与上面 build.args.BASE_PATH 完全一致（留空则都不填）。
      # 服务端用它补回响应里漏掉的站内地址，并在反代保留前缀时把前缀剥掉。
      # 详见 deploy/README.md 的「子路径部署」。
      # WB_BASE_PATH: /workbuddy-manager
      # 反向代理在后面时，真实 IP 取自它覆盖写入的 X-Real-IP
      WB_TRUST_PROXY: "1"
      # 生产环境不暴露 /docs 与 /openapi.json
      WB_ENABLE_DOCS: "0"
      # 出口代理（可选）：写在与本文件同目录的 .env 里即可，compose 用 ${} 取过来。
      # 支持 http:// / https:// / socks5://；内网与本机目标（含上游那一跳）始终直连。
      WB_HTTP_PROXY: ${WB_HTTP_PROXY:-}
      # 一键更新的下载代理（可选，只认 http/https）
      WB_UPDATE_PROXY: ${WB_UPDATE_PROXY:-}
      # GitHub 镜像加速（可选，issue #216）：国内机器直连 GitHub 超时时填基址，
      # 例如 https://gh-proxy.com/ 。版本检测与发布包下载先走镜像，失败回退直连。
      WB_GITHUB_MIRROR: ${WB_GITHUB_MIRROR:-}
      # 新账号默认绑定的命名线路（名字要在上游 config.json 的 proxies 里）
      WB_DEFAULT_ACCOUNT_PROXY: ${WB_DEFAULT_ACCOUNT_PROXY:-}
    ports:
      # **只监听本机**：管理端必须藏在反向代理之后。
      # 若确需直接从别的机器访问，改成 "7864:7864"，但请先确保有 HTTPS 与访问控制——
      # 管理端持有全部账号凭据，直接暴露到公网是被打穿的常见原因。
      - "127.0.0.1:7864:7864"
    volumes:
      # 数据库、日志、更新状态、上游版本固定标记都在这里。
      # 必须持久化，否则重建容器会丢失统计与审计记录。
      #
      # **权限提示（issue #30）**：bind mount 的目录属主由宿主机决定，镜像内的
      # chown 不起作用。docker 首次自动创建 ./data 时归 root，而容器以 uid 10001
      # 运行 —— 结果是启动时报 `sqlite3.OperationalError: unable to open database
      # file`（那个报错既不说路径也不说原因，很容易误以为是路径配错了）。
      # 宿主机在 compose 所在目录执行一次即可：
      #   chown -R 10001:10001 ./data
      # 若目录在网络文件系统（NFS/SMB）上、改不了属主，改用命名卷：
      #   volumes:
      #     - wb-manager-data:/app/data
      #   # 文件末尾另加：
      #   volumes:
      #     wb-manager-data:
      - ./data:/app/data
      # 上游**整个仓库目录**。生产建议由上游服务独立维护仓库，面板只读写必要的
      # 运行配置与 auths，避免把源码更新权限授予 Web 进程。
      # 一次挂载覆盖下面三件事（分开挂子路径会互相重叠，
      # 反而让权限语义变模糊）：
      #   · 读/写上游 config.json —— 管理端「设置」页保存的目标
      #   · 读/写 auths/ —— 扫码添加账号会落盘 workbuddy-<uid>.json（见
      #     tencent.write_auth_file），所以**不能只读**
      #   · 读上游 docker-compose.yml 做端口收敛；仓库更新请在宿主机完成
      #
      # **权限提示（与上游 issue #108 同款问题）**：bind mount 的目录属主由宿主机
      # 决定，镜像内的 chown 不起作用。若管理端显示「0 个账号」而 auths 里明明有
      # 文件，或添加账号报权限错误，通常是跨 uid 读写不到——宿主机执行一次：
      #   chown -R 10001:10001 ../workbuddy2api/auths
      # （10001 是上游容器内进程的 uid，管理端也用同一 uid，见 Dockerfile）
      #
      # 若你**不想**让管理端碰上游仓库（例如上游由别人维护），改成只挂 config.json
      # 与 auths/ 两条子路径即可：此时「更新上游」会不可用，界面会如实提示。
      - ../workbuddy2api:/opt/workbuddy2api
    extra_hosts:
      # 让容器能通过 host.docker.internal 访问宿主机上的上游
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7864/api/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

