<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Qoder / Trae 统一网关控制面">
<title>网关控制台 · Qoder / Trae</title>
<base href="/__qtg/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>

<div id="boot-tip" style="max-width:560px;margin:16vh auto;padding:20px;border:1px solid #3a4150;border-radius:16px;background:#171a21;color:#e6e8ee;font:14px/1.7 system-ui,-apple-system,'PingFang SC',sans-serif">
  <strong style="display:block;font-size:16px;margin-bottom:8px">控制台正在加载…</strong>
  <p style="margin:0 0 10px;color:#9aa3b2">若此处停留超过 5 秒仍为空白，通常是浏览器缓存了旧版页面。</p>
  <p style="margin:0 0 10px;color:#9aa3b2">请按 <code style="background:#0d1016;padding:1px 6px;border-radius:5px">Ctrl+Shift+R</code>（macOS：<code style="background:#0d1016;padding:1px 6px;border-radius:5px">Cmd+Shift+R</code>）强制刷新一次。</p>
  <p style="margin:0;color:#9aa3b2">也可直接检查：<a href="/__qtg/healthz" style="color:#4f8cff">/__qtg/healthz</a> 与 <a href="/__qtg/assets/js/app.js" style="color:#4f8cff">/__qtg/assets/js/app.js</a>（后者应返回 JS 源码，而不是 HTML）。</p>
</div>

<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="brand-mark" aria-hidden="true">Q</div>
    <h1>网关控制台</h1>
    <p class="muted">Qoder / Trae 统一控制面</p>
    <label class="field">
      <span>管理密码</span>
      <input id="loginPassword" type="password" name="password" required
             autocomplete="current-password" placeholder="粘贴管理令牌">
    </label>
    <button class="btn primary" type="submit">进入控制台</button>
    <p class="err" id="loginError" role="alert"></p>
    <p class="hint">可用令牌（任一）：<code>/opt/qtg/secrets/admin_token</code>（新版）或 <code>/opt/preview/token</code>（旧面板令牌）</p>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-mark sm" aria-hidden="true">Q</div>
      <div class="brand-text">
        <strong>网关控制台</strong>
        <span class="muted" id="brandSub">Qoder / Trae</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="paletteBtn" title="命令面板 (Ctrl+K)" aria-label="命令面板">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="刷新数据" aria-label="刷新数据">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="adminBtn" title="管理员" aria-label="管理员">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" title="退出登录" aria-label="退出登录">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <main class="main" id="main" tabindex="-1">
    <div class="page-head">
      <div>
        <h2 id="pageTitle">概览</h2>
        <p class="muted sm" id="pageSub">正在加载…</p>
      </div>
      <div class="page-actions" id="pageActions"></div>
    </div>
    <div id="page" class="page" aria-live="polite"></div>
  </main>

  <nav class="dock" id="dock" aria-label="主导航"></nav>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>

<script src="assets/vendor/motion.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
