# Anonymous claim is explicitly public; QTG's unavailable feature returns 410.
# No client authentication/identity headers are forwarded on this public path.
location ^~ /api/claim/ {
    proxy_pass $zh_control_backend;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host $http_host;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Length $content_length;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-QTG-Platform $http_x_qtg_platform;
    proxy_cache off;
}
