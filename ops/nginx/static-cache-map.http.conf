# K37：按 URI 决定 Cache-Control（**http 上下文**）
#
# 放在 http { } 内（与 three-platform-routing.http.conf 同级）；server 侧用
# static-cache.server.conf 的一条 add_header 引用这个变量。
#
# ## 为什么用 map + server 级 add_header，而不是在每个 location 里写 add_header
#
# Nginx 有一个反直觉规则（N37 踩过）：**只要 location 里出现任何 `add_header`，
# server 级的 `add_header` 全部不再继承**。历史上 fixture 的 `location /` 和
# `location ~ \.txt$` 各自写了 `add_header Cache-Control "no-store"`，于是：
#   · 想给 `/_next/` 加强缓存就必须再写一条 location 级 add_header；
#   · 而那条 location 级 add_header 会把 server 级的安全头（nosniff / DENY /
#     Referrer-Policy / CSP）一起挤掉 —— 加缓存反而制造安全回归。
#
# map 方案把「哪个 URI 用什么缓存策略」做成变量，server 级只加**一条**
# add_header；各 location 不再写 add_header，于是安全头与缓存头同时生效。
#
# ## 策略
#
#   · `/_next/static/**`：文件名含内容哈希 → 一年 + immutable（K37 的主目标，
#     热缓存应能省掉几乎全部 JS/CSS/字体）；
#   · favicon / images / 字体：内容稳定但不带哈希 → 一天（可回源校验）；
#   · 其余（HTML 文档、RSC `.txt` payload）：no-cache，每次回源校验。发布后
#     必须立刻拿到新版本，否则旧页面引用旧 chunk（K33 的症状）。
#
# 安全头不在这里声明：它们应由 server 级统一加（本文件不碰它们）。

map $uri $zh_cache_control {
    # 默认：HTML 文档与 RSC/导航 payload（*.txt）都不缓存
    default                                   "no-cache";

    # Next 构建产物：`_next/static/<buildId>/...`，文件名含内容哈希
    ~^/_next/static/                          "public, max-age=31536000, immutable";

    # 图标 / 图片 / 字体：内容稳定但文件名不带哈希，回源校验窗口给一天
    ~^/(?:favicon|images|icons)/              "public, max-age=86400";
    ~*\.(?:woff2?|ttf|otf)$                   "public, max-age=86400";
    ~*\.(?:png|jpe?g|gif|svg|ico|webp|avif)$  "public, max-age=86400";
}
