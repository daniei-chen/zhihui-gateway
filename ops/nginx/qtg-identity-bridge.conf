# SERVER-context candidate. Replace the existing protected /api/ location;
# include three-platform-routing.http.conf in the HTTP context first.
# retain the deployment's explicit public Manager login/logout/me locations.
# Enable only with QTG authz_enforce=1 + human_session_required=1, both services
# using WB_QTG_IDENTITY_SECRET_FILE / QTG_IDENTITY_SIGNING_KEY_FILE with equal
# dedicated key material (0600), distinct from every machine/admin token, and
# successful composed runtime tests.
# This contains no long-lived credential. Do not deploy as a whole vhost.

location = /__zh_identity {
    internal;
    proxy_pass http://127.0.0.1:7864/api/authz/probe;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header X-QTG-Identity "";
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    access_log off;
}

# The assertion is an internal subrequest result, never a public token endpoint.
location = /api/authz/probe { return 404; }

location /api/ {
    auth_request /__zh_identity;
    auth_request_set $zh_identity $upstream_http_x_qtg_identity;
    auth_request_set $zh_renew_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $zh_renew_cookie always;
    proxy_pass $zh_control_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # QTG verifies the actual trusted edge peer. Uvicorn's default proxy-header
    # middleware otherwise replaces scope.client with the external XFF address.
    # X-Real-IP below carries the externally observed client for audit only.
    proxy_set_header X-Forwarded-For $zh_control_forwarded_for;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $zh_control_authorization;
    proxy_set_header X-API-Key $zh_control_api_key;
    proxy_set_header X-QTG-Identity $zh_identity;
    proxy_set_header X-QTG-Identity-Required "1";
    proxy_set_header X-QTG-Internal-Auth "";
    proxy_set_header X-QTG-Sub "";
    proxy_set_header X-QTG-Role "";
    proxy_set_header X-QTG-Scopes "";
    proxy_set_header X-QTG-Auth-Method "";
    proxy_set_header X-QTG-Aud "";
    proxy_set_header X-QTG-Exp "";
    proxy_set_header X-QTG-Iss "";
    proxy_set_header X-QTG-Jti "";
    proxy_set_header X-User "";
    proxy_set_header X-Role "";
    proxy_set_header X-Roles "";
    proxy_set_header X-Scopes "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Remote-User "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Role "";
    proxy_set_header X-Ingress-User "";
    proxy_set_header X-Ingress-Role "";
    proxy_set_header X-Wb-User "";
    proxy_set_header X-Wb-Role "";
    proxy_set_header X-QTG-Probe-Action "";
    proxy_set_header X-QTG-Probe-Platform "";
    proxy_set_header X-QTG-Probe-Method "";
    proxy_set_header X-QTG-Probe-Path "";
    proxy_hide_header X-QTG-Identity;
    proxy_cache off;
    proxy_buffering off;
}
