# Include inside each existing /v1/, /qoder/v1/, /trae/v1/ and /wb/ location.
# Preserve its proxy_pass, platform selection, SSE buffering and timeout policy.
client_max_body_size 64m;
client_body_timeout 30s;
proxy_request_buffering off;
proxy_next_upstream off;
limit_req zone=zh_gateway_ip_rate burst=60 nodelay;
limit_req zone=zh_gateway_all_rate burst=240 nodelay;
limit_req_status 429;
limit_conn zh_gateway_ip_connections 64;
limit_conn zh_gateway_all_connections 128;
limit_conn_status 429;
error_page 413 = @zh_gateway_body_rejected;
error_page 429 = @zh_gateway_edge_limited;
