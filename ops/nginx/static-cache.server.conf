# K37：静态资源缓存头（**server 上下文**）
#
# 放在 server { } 内、**所有 location 之外**，并且与
# `static-cache-map.http.conf`（http 上下文，定义 $zh_cache_control）配套使用。
#
# 只有一条 add_header，原因见 map 文件顶部：location 级 add_header 会屏蔽
# server 级继承（N37 坑），所以缓存策略只在这里按变量取值，各 location 不写
# add_header。若某个 location 里**本来就有** add_header（历史配置常见
# `add_header Cache-Control "no-store"`），必须先删除它，否则那个 location 的
# 响应仍用旧策略、且安全头会丢。
#
# 部署检查（改完必须实测，不能只看文本）：
#   curl -sI https://<host>/_next/static/chunks/<any>.js | grep -i '^cache-control'
#   → 期望 public, max-age=31536000, immutable
#   curl -sI https://<host>/ | grep -i '^cache-control'
#   → 期望 no-cache
#   curl -sI https://<host>/_next/static/chunks/<any>.js | grep -i 'x-content-type-options'
#   → 期望 nosniff（证明安全头没有被缓存头挤掉）
#
# `always` 让 4xx/5xx 也带上头（否则 404 会被浏览器启发式缓存，发布后旧 chunk
# 的 404 会粘住一段时间）。

add_header Cache-Control $zh_cache_control always;
