# SERVER context; candidate only, not an installed-state declaration.
location @zh_gateway_body_rejected {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    return 413 '{"type":"error","error":{"type":"invalid_request_error","code":"payload_too_large","message":"Request body exceeds the 64 MiB edge limit"}}';
}
location @zh_gateway_edge_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"type":"error","error":{"type":"rate_limit_error","code":"edge_capacity_exceeded","message":"Gateway edge capacity reached; retry later"}}';
}
location @zh_panel_unauthenticated {
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    return 401 '{"error":{"type":"authentication_error","code":"session_required","message":"Sign in to access the control panel"}}';
}
location = /readyz {
    proxy_pass http://zhihui_mgr/readyz;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_next_upstream off;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
}

# Replace, never duplicate, the old experimental proxy locations. Minimal logs
# retain source/status but never an authorization code in callback query args.
location = /trae-callback-test {
    access_log /var/log/nginx/workbuddy-audit.log zh_gateway_minimal;
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    return 410 '{"error":{"code":"callback_experiment_retired"}}';
}
location ^~ /trae-callback-test/ {
    access_log /var/log/nginx/workbuddy-audit.log zh_gateway_minimal;
    default_type application/json;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    return 410 '{"error":{"code":"callback_experiment_retired"}}';
}
