# K08 / K09 候选：边缘收敛片段（未部署）
#
# 用法：把下面的 location 合并进 /etc/nginx/sites-enabled/gateway.example.com，
# 位置要**在现有 `location /wb/` 之前**（Nginx 前缀匹配取最长前缀，但同一前缀
# 的多个 location 会冲突，直接替换原块最稳）。禁止整文件覆盖后不跑 nginx -t。
#
# 现状（2026-10-23 只读取证）：
#   location = /metrics { return 404; }        # 已有
#   location /wb/ { proxy_pass http://127.0.0.1:7864/; }   # 全站别名仍在
#   → /wb/metrics 可匿名读到 Prometheus 指标（K08），/wb/api/* 等于第二套管理面（K09）

# ── K08：指标与就绪探测只在 loopback 可见 ──────────────────────────────
# 采集器在本机；外部请求由 allow/deny 拒绝。应用仍逐次要求独立指标凭据。
# 先给采集器配置 Authorization 和 WB_METRICS_TOKEN_FILE，再启用应用鉴权。
location = /wb/metrics {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:7864/metrics;
    proxy_set_header Authorization $http_authorization;
    access_log off;
}
location = /wb/api/metrics {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:7864/metrics;
    proxy_set_header Authorization $http_authorization;
    access_log off;
}

# ── K09：/wb/ 别名收敛（先统计依赖再启用）────────────────────────────
# 目标：保留历史推理路径 /wb/v1/*，其余 /wb/* 不再等于第二套管理面。
# 启用前必须确认：客户端只用 /wb/v1（GA 客户端/旧 SDK），没有 /wb/api 调用。
location ^~ /wb/v1/ {
    proxy_pass http://127.0.0.1:7864/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 600s;
}
location ^~ /wb/ {
    return 404;
}

# 依赖统计命令（只读，放在启用前）：
#   awk '{print $7}' /var/log/nginx/access.log | grep '^/wb/' | cut -d/ -f1-3 | sort | uniq -c | sort -rn | head
# 若统计结果显示仍有 /wb/api/* 或 /wb/settings/* 的调用，先做客户端升级，不要直接 404。

# 回退：恢复备份的 sites-enabled 文件 → nginx -t → systemctl reload nginx。
# 不要用"名字里带 backup 的旧文件"直接覆盖——必须先看它是否含匿名管理面。
