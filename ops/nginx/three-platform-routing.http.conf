# HTTP context. Include before qtg-identity-bridge.conf in the server block.
# WorkBuddy remains the default; Qoder/Trae management calls use QTG.
map $http_x_qtg_platform $zh_control_backend {
    default http://127.0.0.1:7864;
    qoder http://127.0.0.1:8795;
    trae http://127.0.0.1:8795;
}
map $http_x_qtg_platform $zh_control_authorization {
    default $http_authorization;
    qoder "";
    trae "";
}
map $http_x_qtg_platform $zh_control_api_key {
    default $http_x_api_key;
    qoder "";
    trae "";
}
map $http_x_qtg_platform $zh_control_forwarded_for {
    default $remote_addr;
    qoder "";
    trae "";
}
