# HTTP context; candidate only. Limits are shared across the three data paths.
# Per-IP limits allow multiple legitimate clients behind a common NAT.
limit_req_zone $binary_remote_addr zone=zh_gateway_ip_rate:10m rate=30r/s;
limit_req_zone $server_name zone=zh_gateway_all_rate:1m rate=120r/s;
limit_conn_zone $binary_remote_addr zone=zh_gateway_ip_connections:10m;
limit_conn_zone $server_name zone=zh_gateway_all_connections:1m;

# Do not log callback arguments, Authorization, cookies or request bodies.
log_format zh_gateway_minimal '$remote_addr [$time_local] "$request_method $uri" '
                              '$status $body_bytes_sent request_id=$request_id';
