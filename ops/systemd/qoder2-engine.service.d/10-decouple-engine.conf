# K13 · Qoder 引擎不再跟随 QTG 停机
#
# ⚠️ 本文件是**说明 + 正确做法**，不是可直接安装的 drop-in。
#
# 为什么不能靠 drop-in：实测（systemd 255，见 design/K13-restart-coupling-drill.md）
#   `PartOf` 是**列表属性**，在 drop-in 里写 `PartOf=`（空值）**不会清空**主 unit
#   的赋值。实测：装了这个 drop-in 之后 `systemctl show -p PartOf` 仍返回
#   `qtg.service`，重启 qtg 时引擎 PID 照样变化（130310 → 130425）。
#   第一版候选（`[Unit] PartOf=` 放在 drop-in 里）**按原样安装没有任何效果**。
#
# 唯一有效做法：**改主 unit 文件**（把副本放到 /etc 覆盖 /lib 的）：
#
#   sudo cp /lib/systemd/system/qoder2-engine.service \
#           /etc/systemd/system/qoder2-engine.service
#   sudo sed -i '/^PartOf=/d' /etc/systemd/system/qoder2-engine.service
#   sudo systemctl daemon-reload
#   systemctl show -p PartOf qoder2-engine.service     # 必须是空 —— 验证不能省
#
# 验证解耦真的生效（顺序不能变）：
#   systemctl show -p MainPID qoder2-engine.service    # 记下 PID
#   sudo systemctl restart qtg
#   sleep 2
#   systemctl show -p MainPID qoder2-engine.service    # 必须与上面相同
#   curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8799/   # 200
#
# 回退：删除 /etc/systemd/system/qoder2-engine.service → daemon-reload
#       （无需重启引擎；下次重启 QTG 时恢复旧的连带行为）
#
# 关于 qtg.service 上的 ConsistsOf=qoder2-engine.service：
#   那是 systemd 根据引擎的 PartOf 自动生成的**反向属性**，不能在 qtg 侧
#   写配置去掉；去掉引擎的 PartOf 后它会自动消失。
#
# 注意：PartOf 不定义**启动顺序**。若引擎需要「QTG 起来之后」才能启动，
# 那是 After=/Wants= 的事，与本文件无关，不要一起改。
#
# 发布流程仍需先确认引擎在跑，再重启 QTG：QTG 的 Qoder 端点依赖 127.0.0.1:8799。
