# K13 候选：解耦 QTG 发布与 Qoder 引擎生命周期
#
# 安装位置（需授权）：
#   /etc/systemd/system/qtg.service.d/10-decouple-engine.conf
#
# 现场事实：qtg.service 带 ConsistsOf=qoder2-engine.service，
#           于是 systemctl restart qtg 会把 Qoder 引擎一起停掉。
#           Qoder 是三平台之一的数据面上游，管理面发布不应造成推理中断。
#
# ConsistsOf is an automatic inverse property, NOT a unit-file directive.
# There is nothing to configure on the qtg side.
#
# ⚠️ 正确做法在**引擎侧**，而且是**改主 unit 文件**而不是 drop-in：
#   实测 `PartOf` 是列表属性，drop-in 里写 `PartOf=` 清不掉主 unit 的赋值
#   （装完 `systemctl show -p PartOf` 仍返回 qtg.service，重启照样连带）。
#   见 ops/systemd/qoder2-engine.service.d/10-decouple-engine.conf 与
#   design/K13-restart-coupling-drill.md。
#
# 有效做法（在引擎侧）：
#   sudo cp /lib/systemd/system/qoder2-engine.service /etc/systemd/system/
#   sudo sed -i '/^PartOf=/d' /etc/systemd/system/qoder2-engine.service
#   sudo systemctl daemon-reload
#   systemctl show -p PartOf qoder2-engine.service     # 必须为空
#
# 验证：
#   systemctl show -p MainPID qoder2-engine.service   # 记下 PID
#   systemctl restart qtg
#   systemctl show -p MainPID qoder2-engine.service   # 应保持不变
#   curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/   # 引擎仍活
#
# 回退：删除 /etc/systemd/system/qoder2-engine.service → daemon-reload
#       （无需重启引擎）。
#
# 本文件本身只作说明，**不需要安装**。
