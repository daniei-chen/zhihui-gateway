<style id="soft-motion-31">
/* ZHIHUI login 3.1 — a quiet, event-responsive motion layer; original layout and SVG logo preserved. */
:root{--quiet-blue:#6684f6;--motion-slow:cubic-bezier(.25,.7,.2,1)}
.screen::before{content:"";position:absolute;z-index:-3;pointer-events:none;inset:-20%;background:radial-gradient(ellipse 29% 25% at 49% 58%,rgba(156,181,251,.09),transparent 78%),radial-gradient(ellipse 23% 30% at 91% 41%,rgba(178,169,247,.085),transparent 78%);animation:atmosphere 19s ease-in-out infinite alternate}

.orbit-drawing .orbit-traveler{fill:#849cf5;opacity:.39;filter:drop-shadow(0 0 4px rgba(95,120,250,.28));transition:opacity .5s ease}
.screen.is-focused .orbit-traveler{opacity:.68}
.orbit-drawing .orbit-point{animation:nodeBreathe 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.orbit-drawing .orbit-point:nth-of-type(2){animation-delay:1.1s}.orbit-drawing .orbit-point:nth-of-type(3){animation-delay:2.5s}
.brand{position:relative}
.brand::before{content:"";position:absolute;z-index:-1;top:-34px;left:50%;width:152px;height:152px;transform:translateX(-50%);background:radial-gradient(circle,rgba(143,164,255,.14),transparent 65%);border-radius:50%;animation:brandHalo 10s ease-in-out infinite;pointer-events:none}
.brand-mark{transition:filter .35s ease;transform-origin:50% 50%}
.screen.is-focused .brand-mark{filter:drop-shadow(0 10px 16px rgba(95,127,255,.25))}

.auth-card::after{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse 260px 210px at var(--card-x) var(--card-y),rgba(143,164,245,.085),transparent 77%);opacity:0;transition:opacity .55s ease}

.auth-card > *{position:relative;z-index:1}
.card-icon svg{transition:transform .35s var(--motion-slow)}

.form-group:focus-within label{color:#5e73d7}
.control{isolation:isolate}
.control::after{content:"";height:2px;position:absolute;z-index:2;bottom:1px;left:22px;right:22px;background:linear-gradient(90deg,transparent,#7d9cf8 25%,#b29df7 78%,transparent);border-radius:3px;transform:scaleX(0);opacity:0;transform-origin:center;transition:transform .37s var(--motion-slow),opacity .3s;pointer-events:none}
.control:focus-within::after{transform:scaleX(1);opacity:.65}
.control input.invalid{border-color:#dc9ba4;box-shadow:0 0 0 4px rgba(204,84,107,.07)}
.eye-toggle svg{transition:transform .25s var(--motion-slow)}

.submit{position:relative;isolation:isolate;overflow:hidden}
.submit::after{content:"";position:absolute;z-index:-1;top:-20%;bottom:-20%;left:-55%;width:34%;transform:translateX(0) skewX(-19deg);background:linear-gradient(90deg,transparent,rgba(213,225,255,.13),transparent);pointer-events:none;transition:transform .72s var(--motion-slow)}
.submit:hover::after{transform:translateX(505%) skewX(-19deg)}
.submit svg{transition:transform .25s var(--motion-slow)}

.top-link svg{transition:transform .26s var(--motion-slow)}
.top-link:hover svg{transform:translate(2px,-2px)}

@keyframes atmosphere{0%{transform:translate3d(-1%,0,0);opacity:.55}100%{transform:translate3d(1%,.6%,0);opacity:1}}
@keyframes sceneDrift{0%{transform:translate3d(-4px,2px,0)}100%{transform:translate3d(5px,-3px,0)}}
@keyframes orbBreath{0%{opacity:.55;transform:scale(.96)}100%{opacity:1;transform:scale(1.05)}}
@keyframes nodeBreathe{0%,100%{opacity:.67;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
@keyframes brandHalo{0%,100%{opacity:.38;transform:translateX(-50%) scale(.94)}50%{opacity:.85;transform:translateX(-50%) scale(1.08)}}
/* Touch devices avoid continuous layout-affecting parallax. */
@media (hover:none){.auth-card::after{opacity:0!important}.screen::before{animation-duration:25s}.orbit-drawing{animation:none}}
@media(max-width:650px){.brand::before{width:128px;height:128px;top:-29px}.orbit-drawing .orbit-traveler:nth-of-type(2){display:none}.screen::before{opacity:.65}}
@media(prefers-reduced-motion:reduce){.screen::before,.orb.left,.orb.right,.orbit-drawing,.brand::before,.orbit-drawing .orbit-point{animation:none!important}.orbit-drawing .orbit-traveler{display:none}.auth-card::after,.control::after,.submit::after{transition:none!important}.auth-card{transition:none!important}}
</style>

<script>
(()=>{
  'use strict';
  var API_LOGIN='/api/login', API_ME='/api/me', HOME='/dashboard';

  var form=document.getElementById('loginForm');
  var username=document.getElementById('username');
  var password=document.getElementById('password');
  var eye=document.getElementById('togglePassword');
  var slash=document.getElementById('hideSlash');
  var warning=document.getElementById('capsWarning');
  var btn=document.getElementById('submitBtn');
  var label=document.getElementById('submitLabel');
  var status=document.getElementById('formStatus');
  var screen=document.querySelector('.screen');
  var card=document.querySelector('.auth-card');
  var motionQuery=window.matchMedia('(prefers-reduced-motion: reduce)');
  var pointersFine=window.matchMedia('(hover: hover) and (pointer: fine)');
  var busy=false;

  var setStatus=(text,kind)=>{status.textContent=text||'';status.className=kind?'status show '+kind:'status';};
  var clearStatus=()=>{status.textContent='';status.className='status';};
  var readJson=async(res)=>{try{return await res.json();}catch(e){return null;}};
  var detailOf=(data,fallback)=>(data&&typeof data.detail==='string'&&data.detail)?data.detail:fallback;

  /* ── 装饰动画：尊重系统动效偏好，后台标签页暂停 ── */
  var orbit=document.querySelector('.orbit-drawing');
  var updateAnimation=()=>{
    if(!orbit)return;
    if(motionQuery.matches||document.hidden){orbit.pauseAnimations&&orbit.pauseAnimations();}
    else{orbit.unpauseAnimations&&orbit.unpauseAnimations();}
  };
  motionQuery.addEventListener&&motionQuery.addEventListener('change',updateAnimation);
  document.addEventListener('visibilitychange',updateAnimation);
  updateAnimation();

  /* ── 卡片跟随指针的柔光 ── */
  var hoverFrame=0;
  card.addEventListener('pointermove',event=>{
    if(!pointersFine.matches||motionQuery.matches)return;
    if(hoverFrame)return;
    var x=event.clientX,y=event.clientY;
    hoverFrame=requestAnimationFrame(()=>{
      var box=card.getBoundingClientRect();
      card.style.setProperty('--card-x',((x-box.left)/box.width*100).toFixed(1)+'%');
      card.style.setProperty('--card-y',((y-box.top)/box.height*100).toFixed(1)+'%');
      hoverFrame=0;
    });
  },{passive:true});

  form.addEventListener('focusin',()=>screen.classList.add('is-focused'));
  form.addEventListener('focusout',()=>requestAnimationFrame(()=>{
    if(!form.contains(document.activeElement))screen.classList.remove('is-focused');
  }));

  [username,password].forEach(field=>field.addEventListener('input',()=>{
    field.classList.remove('invalid');
    if(status.classList.contains('error'))clearStatus();
  }));

  eye.addEventListener('click',()=>{
    var show=password.type==='password';
    password.type=show?'text':'password';
    eye.setAttribute('aria-label',show?'隐藏密码':'显示密码');
    eye.setAttribute('aria-pressed',String(show));
    slash.style.display=show?'none':'';
    password.focus({preventScroll:true});
  });

  password.addEventListener('keyup',ev=>{warning.classList.toggle('on',!!(ev.getModifierState&&ev.getModifierState('CapsLock')));});
  password.addEventListener('blur',()=>warning.classList.remove('on'));

  var setBusy=(on)=>{
    busy=on;
    btn.classList.toggle('loading',on);
    btn.disabled=on;
    label.textContent=on?'登录中…':'登录';
    if(on)form.setAttribute('aria-busy','true');else form.removeAttribute('aria-busy');
  };

  /* 已登录会话直接进控制台（401 则安静留在本页）。
     会话过期的提示与探测相互独立：提示先出现，若其实仍已登录则跳转本身会覆盖它。 */
  var isExpired=()=>{
    try{return new URLSearchParams(window.location.search).get('expired')==='1';}
    catch(e){return false;}
  };
  if(isExpired())setStatus('登录状态已过期，请重新登录。','info');
  fetch(API_ME,{credentials:'same-origin',cache:'no-store',headers:{'Accept':'application/json'}})
    .then(res=>{if(res.ok)window.location.replace(HOME);})
    .catch(()=>{});

  form.addEventListener('submit',async ev=>{
    ev.preventDefault();
    if(busy)return;
    var name=username.value.trim();
    var pwd=password.value;
    if(!name){username.classList.add('invalid');setStatus('请输入用户名。','error');username.focus();return;}
    if(!pwd){password.classList.add('invalid');setStatus('请输入密码。','error');password.focus();return;}

    setBusy(true);
    clearStatus();
    var succeeded=false;
    try{
      var res=await fetch(API_LOGIN,{
        method:'POST',
        credentials:'same-origin',
        cache:'no-store',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({username:name,password:pwd})
      });
      var data=await readJson(res);
      if(res.ok&&data&&data.ok===true){
        succeeded=true;
        label.textContent='进入中…';
        setStatus('登录成功，正在进入控制台…','info');
        window.location.replace(HOME);
        return;
      }
      if(res.status===401){
        setStatus(detailOf(data,'用户名或密码错误，请重试。'),'error');
        password.value='';
        password.classList.add('invalid');
        password.focus();
      }else if(res.status===429){
        setStatus(detailOf(data,'登录尝试过于频繁，请稍后再试。'),'error');
      }else if(res.status===400){
        setStatus(detailOf(data,'请求格式错误，请刷新页面后重试。'),'error');
      }else if(res.status>=500){
        setStatus('服务暂时不可用，请稍后再试。','error');
      }else{
        setStatus(detailOf(data,'登录失败，请稍后再试。'),'error');
      }
    }catch(err){
      setStatus('无法连接服务器，请检查网络后重试。','error');
    }finally{
      if(!succeeded)setBusy(false);
    }
  });
})();
</script>
</body>
</html>
