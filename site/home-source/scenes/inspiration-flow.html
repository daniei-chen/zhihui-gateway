<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>智汇 · 灵感汇流</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fbfcfe;color:#34465b;font-family:Bahnschrift,"Microsoft YaHei",sans-serif}#inspirationSurface{position:absolute;inset:0;touch-action:pan-y}#inspirationPoster,canvas{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}canvas{opacity:0;transition:opacity .7s}html[data-scene=ready] canvas{opacity:1}.heading{position:absolute;top:26px;left:28px;right:28px;display:flex;justify-content:space-between;gap:12px;color:#6a7b91;font-size:8px;letter-spacing:2px;pointer-events:none}.heading span:last-child{letter-spacing:1px;font-size:9px}.foot{position:absolute;bottom:24px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.modes{display:flex;gap:4px;padding:4px;border:1px solid #dfe7ed;border-radius:24px;background:#ffffffdf}.modes button{font:inherit;font-size:10px;border:0;border-radius:18px;padding:8px 14px;background:transparent;color:#69808d;cursor:pointer}.modes button[aria-pressed=true]{background:#edf2f8;color:#315786}.modes button:disabled{opacity:.45;cursor:default}.modes button:focus-visible{outline:2px solid #3683fc;outline-offset:2px}#inspirationStatus{font-size:9px;color:#6d7f91;margin:0;max-width:180px;line-height:1.7}.credit{position:absolute;bottom:2px;left:24px;color:#8593a2;font-size:6px;letter-spacing:.6px;margin:0;pointer-events:none}@media(max-width:480px){.heading{left:18px;right:18px;top:20px;font-size:7px;letter-spacing:1px}.heading span:last-child{font-size:8px}.foot{left:16px;right:16px;bottom:22px;flex-wrap:wrap;justify-content:center}#inspirationStatus{text-align:center;max-width:none;width:100%;font-size:8px}.modes button{padding:7px 13px}.credit{left:0;width:100%;text-align:center}}@media(prefers-reduced-motion:reduce){canvas{transition:none}}
</style></head><body>
<div id="inspirationSurface" role="img" aria-label="蓝、青绿与暖杏色交汇的灵感光环"><img id="inspirationPoster" src="/animations/inspiration-poster.webp" width="960" height="800" alt="" decoding="async"><canvas id="inspirationCanvas" aria-hidden="true"></canvas></div>
<div class="heading"><span>IDEAS, IN CONFLUENCE</span><span>灵感汇流 / ZHIHUI</span></div>
<div class="foot"><div class="modes" role="group" aria-label="灵感形态"><button data-flow-mode="flow" aria-pressed="true" disabled>汇流</button><button data-flow-mode="open" aria-pressed="false" disabled>舒展</button><button data-flow-mode="focus" aria-pressed="false" disabled>归心</button></div><p id="inspirationStatus" role="status">灵感在这里相遇</p></div>
<p class="credit">Powered by Paper Shaders · Apache-2.0</p><script defer src="/scripts/inspiration-viewer.js"></script></body></html>
