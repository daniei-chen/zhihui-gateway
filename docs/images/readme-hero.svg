<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="408" viewBox="0 0 1200 408" role="img" aria-labelledby="title desc">
  <title id="title">ZHIHUI Gateway — one control plane, three platforms</title>
  <desc id="desc">Minimal white developer-style graphic with a unified gateway routing to WorkBuddy, Qoder and Trae.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F8FC"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#DBE7FF" stop-opacity=".8"/><stop offset=".65" stop-color="#EDEBFF" stop-opacity=".36"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8BBEFF" stop-opacity=".35"/><stop offset=".5" stop-color="#6685F8"/><stop offset="1" stop-color="#8E9FFE" stop-opacity=".85"/></linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#8993AE" flood-opacity=".12"/></filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="406" rx="22"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="406" rx="22" fill="url(#background)" stroke="#E9EDF3"/>
  <g clip-path="url(#frame)">
    <circle cx="850" cy="200" r="305" fill="url(#glow)"/>
    <path d="M0 341H1200" stroke="#EFF1F6"/>
    <path d="M0 362H1200" stroke="#F5F6F9"/>
    <g fill="#121820" font-family="Inter,Arial,sans-serif">
      <text x="70" y="79" font-size="13" font-weight="700" letter-spacing="3" fill="#64748B">UNIFIED AI GATEWAY</text>
      <text x="68" y="168" font-size="65" font-weight="750" letter-spacing="-2">ZHIHUI<tspan fill="#4D6BFE">.</tspan></text>
      <text x="70" y="218" font-size="24" font-weight="600" letter-spacing="-.4">One control plane.</text>
      <text x="70" y="251" font-size="24" font-weight="600" letter-spacing="-.4">Three upstream platforms.</text>
      <text x="72" y="291" font-size="14" fill="#7C8798">Routing · Access control · Metering · Observability</text>
    </g>
    <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600">
      <rect x="69" y="323" width="102" height="29" rx="14.5" fill="#EEF2FF"/>
      <text x="91" y="342" fill="#3E5EC8">WorkBuddy</text>
      <rect x="180" y="323" width="79" height="29" rx="14.5" fill="#F0F4F8"/>
      <text x="196" y="342" fill="#55657F">Qoder</text>
      <rect x="269" y="323" width="71" height="29" rx="14.5" fill="#F0F4F8"/>
      <text x="287" y="342" fill="#55657F">Trae</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="610" y="76" width="238" height="250" rx="21" fill="#FFFFFF" stroke="#DFE6F3"/>
      <rect x="630" y="97" width="198" height="38" rx="11" fill="#F6F8FD"/>
      <circle cx="648" cy="116" r="5" fill="#A3B8F7"/>
      <text x="664" y="121" fill="#6F7A90" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">ZHIHUI / ROUTER</text>
      <path d="M675 171H742L675 232H742" stroke="#4D6BFE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="675" y="274" fill="#263247" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">Policy &amp; identity</text>
      <text x="675" y="294" fill="#8B94A5" font-family="Inter,Arial,sans-serif" font-size="11">One place to control access</text>
    </g>
    <g stroke="url(#beam)" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M848 140C881 140 888 112 927 112"/>
      <path d="M848 202C882 202 890 202 927 202"/>
      <path d="M848 265C881 265 888 291 927 291"/>
    </g>
    <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
      <rect x="928" y="88" width="209" height="49" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
      <circle cx="952" cy="112" r="6" fill="#4D6BFE"/>
      <text x="969" y="117" font-size="15" font-weight="650" fill="#202A3B">WorkBuddy</text>
      <rect x="928" y="178" width="209" height="49" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
      <circle cx="952" cy="202" r="6" fill="#6B88FE"/>
      <text x="969" y="207" font-size="15" font-weight="650" fill="#202A3B">Qoder</text>
      <rect x="928" y="267" width="209" height="49" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
      <circle cx="952" cy="291" r="6" fill="#9A8CF6"/>
      <text x="969" y="296" font-size="15" font-weight="650" fill="#202A3B">Trae</text>
    </g>
    <circle cx="848" cy="140" r="3.5" fill="#6988F9"/><circle cx="848" cy="202" r="3.5" fill="#6988F9"/><circle cx="848" cy="265" r="3.5" fill="#6988F9"/>
  </g>
</svg>