<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">请求日志界面示意</title>
  <desc id="d">请求日志页：多维筛选，逐条展示模型、状态、实际调用账号、首字延迟、总耗时、Token 与提示词缓存命中标记。数据为示例。</desc>
  <rect width="1200" height="720" rx="16" fill="#0b1322"/>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="none" stroke="#1c2740"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="216" height="720" fill="#080f1b"/>
    <line x1="216" y1="0" x2="216" y2="720" stroke="#18233a"/>
    <g transform="translate(24,26)">
      <rect width="30" height="30" rx="8" fill="#0f1d33" stroke="#22c55e" stroke-opacity="0.55"/>
      <path d="M9 20 L15 10 L21 20 M12 17.5 h6" fill="none" stroke="#22c55e" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="66" y="47" fill="#e8eefb" font-size="14" font-weight="700">智汇网关</text>
    <g font-size="12.5" fill="#7f95b4">
      <text x="30" y="108">仪表盘</text>
      <text x="30" y="142">账号管理</text>
      <text x="30" y="176">任务记录</text>
      <text x="30" y="210">API 密钥</text>
      <rect x="12" y="222" width="192" height="34" rx="8" fill="#12203a"/>
      <rect x="12" y="222" width="3" height="34" rx="1.5" fill="#22c55e"/>
      <text x="30" y="244" fill="#dff6e6" font-weight="600">请求日志</text>
      <text x="30" y="288">用量统计</text>
      <text x="30" y="322">模型中心</text>
      <text x="30" y="356">聊天测试台</text>
      <line x1="24" y1="382" x2="192" y2="382" stroke="#18233a"/>
      <text x="30" y="410">安全与 IP 管控</text>
      <text x="30" y="444">设置</text>
    </g>

    <rect x="216" y="0" width="984" height="66" fill="#0a1220"/>
    <line x1="216" y1="66" x2="1200" y2="66" stroke="#18233a"/>
    <text x="244" y="40" fill="#e8eefb" font-size="16" font-weight="700">请求日志</text>
    <text x="330" y="40" fill="#5d7a99" font-size="11.5">全量留痕 · 30 秒自动刷新</text>
    <g transform="translate(830,19)">
      <rect width="250" height="30" rx="15" fill="#0d1728" stroke="#1c2b45"/>
      <rect x="3" y="3" width="82" height="24" rx="12" fill="#16233c"/>
      <text x="44" y="19" fill="#cfe0f5" font-size="11" font-weight="600" text-anchor="middle">WorkBuddy</text>
      <text x="128" y="19" fill="#6d87a6" font-size="11" text-anchor="middle">Qoder</text>
      <text x="208" y="19" fill="#6d87a6" font-size="11" text-anchor="middle">Trae</text>
    </g>

    <!-- filters -->
    <g font-size="11.5">
      <rect x="244" y="90" width="150" height="32" rx="9" fill="#0d1728" stroke="#1c2b45"/>
      <text x="264" y="111" fill="#9fb3cf">近 24 小时</text>
      <rect x="404" y="90" width="130" height="32" rx="9" fill="#0d1728" stroke="#1c2b45"/>
      <text x="424" y="111" fill="#5b7395">全部密钥</text>
      <rect x="544" y="90" width="120" height="32" rx="9" fill="#0d1728" stroke="#1c2b45"/>
      <text x="564" y="111" fill="#5b7395">全部状态</text>
      <rect x="674" y="90" width="150" height="32" rx="9" fill="#0d1728" stroke="#1c2b45"/>
      <text x="694" y="111" fill="#5b7395">全部模型</text>
      <rect x="834" y="90" width="150" height="32" rx="9" fill="#0d1728" stroke="#1c2b45"/>
      <text x="854" y="111" fill="#5b7395">来源 IP</text>
      <rect x="1004" y="90" width="74" height="32" rx="9" fill="#16233c"/>
      <text x="1041" y="111" fill="#cfe0f5" text-anchor="middle">筛选</text>
      <rect x="1088" y="90" width="64" height="32" rx="9" fill="#0d1728" stroke="#1c2b45"/>
      <text x="1120" y="111" fill="#7f95b4" text-anchor="middle">导出</text>
    </g>

    <!-- table -->
    <rect x="244" y="140" width="908" height="530" rx="12" fill="#0d1728" stroke="#1c2b45"/>
    <rect x="244" y="140" width="908" height="38" rx="12" fill="#101c2f"/>
    <rect x="244" y="166" width="908" height="12" fill="#101c2f"/>
    <g font-size="10.5" fill="#5d7a99">
      <text x="262" y="164">时间</text>
      <text x="350" y="164">模型</text>
      <text x="486" y="164">状态</text>
      <text x="534" y="164">账号</text>
      <text x="646" y="164">首字</text>
      <text x="700" y="164">总耗时</text>
      <text x="776" y="164">Token</text>
      <text x="900" y="164">缓存</text>
      <text x="1000" y="164">来源 IP</text>
    </g>

    <g font-size="11">
      <!-- row 1: cache hit -->
      <text x="262" y="196" fill="#7f95b4">18:12:41</text>
      <text x="350" y="196" fill="#b6c9e2">v4.1-flash</text>
      <rect x="482" y="186" width="38" height="17" rx="4" fill="#0d2a1c"/>
      <text x="501" y="198" fill="#2ea86a" font-size="10" text-anchor="middle">200</text>
      <text x="534" y="196" fill="#b6c9e2">账号 甲</text>
      <text x="646" y="196" fill="#7f95b4">1.53s</text>
      <text x="700" y="196" fill="#7f95b4">6.4s</text>
      <text x="776" y="196" fill="#b6c9e2">1,290</text>
      <rect x="894" y="186" width="66" height="17" rx="4" fill="#0d2a1c"/>
      <text x="927" y="198" fill="#2ea86a" font-size="10" text-anchor="middle">缓存 98%</text>
      <text x="1000" y="196" fill="#5b7395">10.0.**.**</text>

      <!-- row 2: cache hit -->
      <text x="262" y="228" fill="#7f95b4">18:12:22</text>
      <text x="350" y="228" fill="#b6c9e2">v4.1-flash</text>
      <rect x="482" y="218" width="38" height="17" rx="4" fill="#0d2a1c"/>
      <text x="501" y="230" fill="#2ea86a" font-size="10" text-anchor="middle">200</text>
      <text x="534" y="228" fill="#b6c9e2">账号 乙</text>
      <text x="646" y="228" fill="#7f95b4">1.31s</text>
      <text x="700" y="228" fill="#7f95b4">6.6s</text>
      <text x="776" y="228" fill="#b6c9e2">1,059</text>
      <rect x="894" y="218" width="66" height="17" rx="4" fill="#0d2a1c"/>
      <text x="927" y="230" fill="#2ea86a" font-size="10" text-anchor="middle">缓存 99%</text>
      <text x="1000" y="228" fill="#5b7395">10.0.**.**</text>

      <!-- row 3: cache miss (account switched) -->
      <text x="262" y="260" fill="#7f95b4">18:12:07</text>
      <text x="350" y="260" fill="#b6c9e2">v4.1-flash</text>
      <rect x="482" y="250" width="38" height="17" rx="4" fill="#0d2a1c"/>
      <text x="501" y="262" fill="#2ea86a" font-size="10" text-anchor="middle">200</text>
      <text x="534" y="262" fill="#f0b429">账号 丙</text>
      <text x="646" y="262" fill="#7f95b4">1.78s</text>
      <text x="700" y="262" fill="#7f95b4">4.1s</text>
      <text x="776" y="262" fill="#b6c9e2">531</text>
      <rect x="894" y="250" width="66" height="17" rx="4" fill="#2d2210"/>
      <text x="927" y="262" fill="#f0b429" font-size="10" text-anchor="middle">未命中</text>
      <text x="1000" y="262" fill="#5b7395">10.0.**.**</text>

      <!-- row 4 -->
      <text x="262" y="292" fill="#7f95b4">18:11:55</text>
      <text x="350" y="292" fill="#b6c9e2">v4.1-pro</text>
      <rect x="482" y="282" width="38" height="17" rx="4" fill="#0d2a1c"/>
      <text x="501" y="294" fill="#2ea86a" font-size="10" text-anchor="middle">200</text>
      <text x="534" y="292" fill="#b6c9e2">账号 甲</text>
      <text x="646" y="292" fill="#7f95b4">2.04s</text>
      <text x="700" y="292" fill="#7f95b4">8.2s</text>
      <text x="776" y="292" fill="#b6c9e2">1,449</text>
      <rect x="894" y="282" width="66" height="17" rx="4" fill="#0d2a1c"/>
      <text x="927" y="294" fill="#2ea86a" font-size="10" text-anchor="middle">缓存 97%</text>
      <text x="1000" y="294" fill="#5b7395">10.0.**.**</text>

      <!-- row 5: 401 -->
      <text x="262" y="324" fill="#7f95b4">18:11:30</text>
      <text x="350" y="324" fill="#5b7395">—</text>
      <rect x="482" y="314" width="38" height="17" rx="4" fill="#2b1416"/>
      <text x="501" y="326" fill="#ef4444" font-size="10" text-anchor="middle">401</text>
      <text x="534" y="324" fill="#5b7395">—</text>
      <text x="646" y="324" fill="#5b7395">—</text>
      <text x="700" y="324" fill="#5b7395">0.0s</text>
      <text x="776" y="324" fill="#5b7395">—</text>
      <text x="894" y="324" fill="#3f5675">—</text>
      <text x="1000" y="324" fill="#5b7395">10.0.**.**</text>

      <!-- row 6 -->
      <text x="262" y="356" fill="#7f95b4">18:11:02</text>
      <text x="350" y="356" fill="#b6c9e2">v4.1-flash</text>
      <rect x="482" y="346" width="38" height="17" rx="4" fill="#0d2a1c"/>
      <text x="501" y="358" fill="#2ea86a" font-size="10" text-anchor="middle">200</text>
      <text x="534" y="358" fill="#b6c9e2">账号 戊</text>
      <text x="646" y="358" fill="#7f95b4">—</text>
