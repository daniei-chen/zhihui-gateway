    <line x1="244" y1="416" x2="1152" y2="416" stroke="#18233a"/>
    <text x="262" y="442" fill="#5d7a99" font-size="11.5">共 7,383 条 · 第 1 / 92 页</text>

    <!-- legend -->
    <g font-size="10.5" fill="#5b7395">
      <text x="262" y="478" font-weight="700" fill="#7f95b4">读表要点</text>
      <text x="262" y="502">· 账号 = 本次实际落在哪个上游号，由上游选择、响应不回传，面板按容器日志回填，故滞后几秒</text>
      <text x="262" y="526">· 缓存标记来自上游用量数据：绿色是命中比例，琥珀「未命中」表示这段前缀没吃到缓存</text>
      <text x="262" y="550">· 前缀缓存按账号存 —— 「换账号」与「未命中」常常一起出现，配合账号列看才有意义</text>
      <text x="262" y="574">· 首字 = 到第一个含正文的 delta；非流式请求没有中间过程，显示 —</text>
      <text x="262" y="598">· 账号列一直显示 — 通常意味着容器日志读不到（上游不在本机 / 未挂 docker.sock）</text>
    </g>

    <text x="1152" y="706" fill="#33465f" font-size="10" text-anchor="end">布局示意 · 数据为示例</text>
  </g>
</svg>
