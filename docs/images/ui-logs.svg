      <text x="776" y="358" fill="#b6c9e2">469</text>
      <rect x="894" y="346" width="66" height="17" rx="4" fill="#0d2a1c"/>
      <text x="927" y="358" fill="#2ea86a" font-size="10" text-anchor="middle">缓存 96%</text>
      <text x="1000" y="358" fill="#5b7395">10.0.**.**</text>

      <!-- row 7 -->
      <text x="262" y="388" fill="#7f95b4">18:10:44</text>
      <text x="350" y="388" fill="#b6c9e2">v4.1-flash</text>
      <rect x="482" y="378" width="38" height="17" rx="4" fill="#0d2a1c"/>
      <text x="501" y="390" fill="#2ea86a" font-size="10" text-anchor="middle">200</text>
      <text x="534" y="390" fill="#b6c9e2">账号 乙</text>
      <text x="646" y="390" fill="#7f95b4">1.42s</text>
      <text x="700" y="390" fill="#7f95b4">5.7s</text>
      <text x="776" y="390" fill="#b6c9e2">800</text>
      <rect x="894" y="378" width="66" height="17" rx="4" fill="#0d2a1c"/>
      <text x="927" y="390" fill="#2ea86a" font-size="10" text-anchor="middle">缓存 98%</text>
