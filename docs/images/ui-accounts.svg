    <line x1="244" y1="546" x2="1152" y2="546" stroke="#18233a"/>
    <text x="268" y="572" fill="#5d7a99" font-size="11.5">共 32 个账号 · 第 1 / 4 页</text>
    <g font-size="11">
      <rect x="1046" y="554" width="30" height="26" rx="6" fill="#16233c"/>
      <text x="1061" y="571" fill="#cfe0f5" text-anchor="middle">1</text>
      <rect x="1082" y="554" width="30" height="26" rx="6" fill="#0d1728" stroke="#1c2b45"/>
      <text x="1097" y="571" fill="#7f95b4" text-anchor="middle">2</text>
      <rect x="1118" y="554" width="30" height="26" rx="6" fill="#0d1728" stroke="#1c2b45"/>
