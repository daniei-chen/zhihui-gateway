    <circle cx="266" cy="109" r="5" fill="none" stroke="#4f6a8a" stroke-width="1.6"/>
    <line x1="270" y1="113" x2="274" y2="117" stroke="#4f6a8a" stroke-width="1.6"/>
    <text x="284" y="114" fill="#43597a" font-size="11.5">搜索昵称 / UID</text>

