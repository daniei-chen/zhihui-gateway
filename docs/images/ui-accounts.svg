      <text x="30" y="220">API 密钥</text>
      <text x="30" y="254">请求日志</text>
      <text x="30" y="288">用量统计</text>
      <text x="30" y="322">模型中心</text>
      <text x="30" y="356">聊天测试台</text>
      <line x1="24" y1="382" x2="192" y2="382" stroke="#18233a"/>
      <text x="30" y="410">安全与 IP 管控</text>
      <text x="30" y="444">设置</text>
