<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="t d">
  <title id="t">智汇网关架构</title>
  <desc id="d">下游客户端经 OpenAI 兼容接口进入单端口网关，网关内含反代、管理接口、静态前端与平台分派，再分别驱动 WorkBuddy、Qoder、Trae 三个引擎访问各自上游。</desc>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0b1526"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d5a80"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="1200" height="880" rx="18" fill="url(#abg)"/>
  <rect x="0.5" y="0.5" width="1199" height="879" rx="18" fill="none" stroke="#1e2b45"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">

    <!-- ===== clients ===== -->
    <g>
      <rect x="330" y="42" width="540" height="66" rx="13" fill="#0d1a2e" stroke="#2b6cf6" stroke-opacity="0.45"/>
      <text x="600" y="70" fill="#dbe8fb" font-size="15" font-weight="700" text-anchor="middle">下游客户端 / sub2api</text>
      <text x="600" y="93" fill="#8fa6c4" font-size="12.5" text-anchor="middle">OpenAI SDK · Cursor · Cherry Studio · 任意兼容客户端</text>
    </g>
    <path d="M600 108 L600 168" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>
    <text x="612" y="132" fill="#7f95b4" font-size="12">Authorization: Bearer wbk_xxx</text>
    <text x="612" y="152" fill="#7f95b4" font-size="12">POST /v1/chat/completions（流式 / 非流式）</text>

    <!-- ===== gateway ===== -->
    <rect x="150" y="176" width="900" height="300" rx="16" fill="#0b1626" stroke="#22c55e" stroke-opacity="0.4"/>
    <text x="176" y="205" fill="#9ff0bc" font-size="13.5" font-weight="700">智汇网关　:7864　单进程 · 单端口</text>
    <text x="1024" y="205" fill="#5d7a99" font-size="11.5" text-anchor="end">FastAPI + uvicorn · 无 CORS</text>

    <!-- lane 1: reverse proxy -->
    <rect x="174" y="222" width="852" height="62" rx="11" fill="#0e1c30" stroke="#1f7a4a" stroke-opacity="0.6"/>
    <text x="194" y="245" fill="#8ff0b4" font-size="13" font-weight="700">反代网关</text>
    <text x="278" y="245" fill="#6d87a6" font-size="11.5">/v1 · /healthz · /v1/models</text>
    <g font-size="11.5" fill="#b6c9e2">
      <text x="194" y="270">密钥鉴权</text>
      <text x="266" y="270" fill="#41618a">→</text>
      <text x="284" y="270">IP 管控</text>
      <text x="346" y="270" fill="#41618a">→</text>
      <text x="364" y="270">模型映射</text>
      <text x="432" y="270" fill="#41618a">→</text>
      <text x="450" y="270">流式转发</text>
      <text x="518" y="270" fill="#41618a">→</text>
      <text x="536" y="270">用量落库</text>
    </g>

    <!-- lane 2: admin api -->
    <rect x="174" y="294" width="416" height="52" rx="11" fill="#0e1c30" stroke="#2b4a72"/>
    <text x="194" y="316" fill="#cfe0f5" font-size="12.5" font-weight="700">管理接口</text>
    <text x="268" y="316" fill="#6d87a6" font-size="11.5">/api/*</text>
    <text x="194" y="336" fill="#8ba0bd" font-size="11">登录 · 账号 · 密钥 · 日志 · 用量 · 安全 · 设置</text>

    <!-- lane 3: static web -->
    <rect x="610" y="294" width="416" height="52" rx="11" fill="#0e1c30" stroke="#2b4a72"/>
    <text x="630" y="316" fill="#cfe0f5" font-size="12.5" font-weight="700">Web 前端</text>
    <text x="712" y="316" fill="#6d87a6" font-size="11.5">Next.js 静态导出</text>
    <text x="630" y="336" fill="#8ba0bd" font-size="11">与 /api、/v1 同源，由 FastAPI 托管</text>

    <!-- lane 4: dispatch -->
    <rect x="174" y="356" width="852" height="100" rx="11" fill="#0e1c30" stroke="#8a6a1f" stroke-opacity="0.8"/>
    <text x="194" y="379" fill="#ffd98a" font-size="13" font-weight="700">平台分派　qtgcore</text>
    <text x="194" y="400" fill="#a8946b" font-size="11.5">X-QTG-Platform: qoder | trae　按 10 条白名单前缀路由，其余留在原生实现</text>
    <g font-size="11" fill="#c9bda0">
      <text x="194" y="424">/api/accounts　/api/stats/　/api/models　/api/model-catalog　/api/upstreams</text>
      <text x="194" y="443">/api/platforms　/api/status　/api/checkin-logs　/api/logs　/api/playground</text>
    </g>

    <!-- ===== engines ===== -->
    <path d="M330 476 L330 528" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M600 476 L600 528" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M870 476 L870 528" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>
    <text x="612" y="508" fill="#6d87a6" font-size="11.5">复用 auths/*.json · 查询 /status · /v1/models</text>

    <g>
      <rect x="200" y="536" width="260" height="84" rx="13" fill="#0d1a2e" stroke="#2b6cf6" stroke-opacity="0.6"/>
      <text x="330" y="564" fill="#dbe8fb" font-size="14" font-weight="700" text-anchor="middle">workbuddy2api</text>
      <text x="330" y="585" fill="#7f9bc4" font-size="11.5" text-anchor="middle">Go · :7863 · 容器</text>
      <text x="330" y="605" fill="#69809f" font-size="11" text-anchor="middle">账号轮询 · 并发 · 熔断</text>
    </g>
    <g>
      <rect x="470" y="536" width="260" height="84" rx="13" fill="#0d1a2e" stroke="#8b5cf6" stroke-opacity="0.6"/>
      <text x="600" y="564" fill="#e2d4fb" font-size="14" font-weight="700" text-anchor="middle">qoder2-engine</text>
      <text x="600" y="585" fill="#9a8cc4" font-size="11.5" text-anchor="middle">Python · :8799 · systemd</text>
      <text x="600" y="605" fill="#69809f" font-size="11" text-anchor="middle">Qoder 协议适配</text>
    </g>
    <g>
      <rect x="740" y="536" width="260" height="84" rx="13" fill="#0d1a2e" stroke="#f97316" stroke-opacity="0.6"/>
      <text x="870" y="564" fill="#fbd9c0" font-size="14" font-weight="700" text-anchor="middle">aiwork-server</text>
      <text x="870" y="585" fill="#b38a6d" font-size="11.5" text-anchor="middle">Rust · :8080 · 容器</text>
      <text x="870" y="605" fill="#69809f" font-size="11" text-anchor="middle">Trae 协议适配</text>
    </g>

    <!-- ===== upstreams ===== -->
    <path d="M330 620 L330 668" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M600 620 L600 668" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M870 620 L870 668" stroke="#3d5a80" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="200" y="676" width="800" height="72" rx="13" fill="#0c1728" stroke="#334868"/>
    <text x="600" y="703" fill="#b9cce4" font-size="13" font-weight="700" text-anchor="middle">上游账号池</text>
    <text x="600" y="727" fill="#7b90ad" font-size="11.5" text-anchor="middle">腾讯 CodeBuddy · Qoder · Trae　—　扫码纳管、定时签到、token 保活</text>

    <!-- ===== side notes ===== -->
    <g font-size="11.5">
      <rect x="150" y="784" width="278" height="62" rx="11" fill="#0a1526" stroke="#26374f"/>
      <text x="170" y="807" fill="#8ba0bd" font-weight="700">SQLite（标准库）</text>
      <text x="170" y="827" fill="#6d87a6">日志 · 用量 · 预算预留 · 审计链</text>

      <rect x="446" y="784" width="278" height="62" rx="11" fill="#0a1526" stroke="#26374f"/>
      <text x="466" y="807" fill="#8ba0bd" font-weight="700">Ed25519 双门禁</text>
      <text x="466" y="827" fill="#6d87a6">源码清单 + 前端 manifest 逐文件校验</text>

      <rect x="742" y="784" width="308" height="62" rx="11" fill="#0a1526" stroke="#26374f"/>
      <text x="762" y="807" fill="#8ba0bd" font-weight="700">发布与备份</text>
      <text x="762" y="827" fill="#6d87a6">签名发布包 · 配置/数据每日快照</text>
    </g>
  </g>
</svg>
