<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">智汇网关</title>
  <desc id="d">三平台统一 LLM 网关与账号池管理控制台：WorkBuddy、Qoder、Trae 汇聚为一个 OpenAI 兼容入口。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#0a1526"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <ellipse cx="990" cy="120" rx="270" ry="150" fill="url(#glow)" filter="url(#soft)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="none" stroke="#1e2b45"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <!-- brand mark -->
    <g transform="translate(64,58)">
      <rect width="46" height="46" rx="12" fill="#0f1d33" stroke="#22c55e" stroke-opacity="0.5"/>
      <path d="M14 31 L23 15 L32 31 M18.5 26.5 h9" fill="none" stroke="#22c55e" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="126" y="76" fill="#e8eefb" font-size="30" font-weight="700" letter-spacing="1">智汇网关</text>
    <text x="126" y="100" fill="#7186a6" font-size="13.5" letter-spacing="0.6">ZHIHUI GATEWAY</text>

    <text x="64" y="176" fill="#f2f6fd" font-size="35" font-weight="700">三平台统一 LLM 网关</text>
    <text x="64" y="208" fill="#93a5c2" font-size="17">一个 OpenAI 兼容入口，统一纳管账号池、密钥分发、用量与安全策略</text>

    <!-- platform pills -->
    <g font-size="14.5" font-weight="600">
      <g transform="translate(64,238)">
        <rect width="150" height="40" rx="20" fill="#0d1a2e" stroke="#2b6cf6" stroke-opacity="0.55"/>
        <circle cx="24" cy="20" r="5" fill="#2b6cf6"/>
        <text x="40" y="25" fill="#bcd2f7">WorkBuddy</text>
      </g>
      <g transform="translate(228,238)">
        <rect width="126" height="40" rx="20" fill="#0d1a2e" stroke="#a855f7" stroke-opacity="0.55"/>
        <circle cx="24" cy="20" r="5" fill="#a855f7"/>
        <text x="40" y="25" fill="#dcc7fb">Qoder</text>
      </g>
      <g transform="translate(368,238)">
        <rect width="112" height="40" rx="20" fill="#0d1a2e" stroke="#f97316" stroke-opacity="0.55"/>
        <circle cx="24" cy="20" r="5" fill="#f97316"/>
        <text x="40" y="25" fill="#fbd4b6">Trae</text>
      </g>
    </g>

    <!-- metric strip -->
    <g font-size="12.5" fill="#7e92b0">
      <text x="64" y="322">单进程单端口</text>
      <text x="190" y="322">Ed25519 签名发布</text>
      <text x="350" y="322">SQLite 零重依赖</text>
      <text x="500" y="322">MIT</text>
    </g>

    <!-- right: convergence diagram -->
    <g transform="translate(760,86)">
      <g font-size="13" font-weight="600" text-anchor="middle">
        <g>
          <rect x="0" y="0" width="132" height="44" rx="11" fill="#0d1a2e" stroke="#2b6cf6" stroke-opacity="0.6"/>
          <text x="66" y="28" fill="#bcd2f7">WorkBuddy</text>
        </g>
        <g transform="translate(0,72)">
          <rect width="132" height="44" rx="11" fill="#0d1a2e" stroke="#a855f7" stroke-opacity="0.6"/>
          <text x="66" y="28" fill="#dcc7fb">Qoder</text>
        </g>
        <g transform="translate(0,144)">
          <rect width="132" height="44" rx="11" fill="#0d1a2e" stroke="#f97316" stroke-opacity="0.6"/>
          <text x="66" y="28" fill="#fbd4b6">Trae</text>
        </g>
      </g>

      <g stroke="url(#line)" stroke-width="2" fill="none">
        <path d="M132 22 C 190 22, 190 110, 248 110"/>
        <path d="M132 94 C 190 94, 190 110, 248 110"/>
        <path d="M132 166 C 190 166, 190 110, 248 110"/>
      </g>
      <g fill="#22c55e" opacity="0.85">
        <circle cx="196" cy="60" r="2.6"/><circle cx="214" cy="110" r="2.6"/><circle cx="196" cy="152" r="2.6"/>
      </g>

      <!-- gateway node -->
      <g transform="translate(248,72)">
        <rect width="150" height="76" rx="14" fill="#0c1728" stroke="#22c55e" stroke-opacity="0.65"/>
        <text x="75" y="31" fill="#dff6e6" font-size="14" font-weight="700" text-anchor="middle">智汇网关</text>
        <text x="75" y="52" fill="#6f8fa8" font-size="11.5" text-anchor="middle">:7864 · 单端口</text>
      </g>

      <!-- egress -->
      <g stroke="#22c55e" stroke-opacity="0.45" stroke-width="2" fill="none">
        <path d="M398 110 L442 110"/>
      </g>
      <polygon points="442,105 452,110 442,115" fill="#22c55e" fill-opacity="0.7"/>
      <text x="424" y="140" fill="#7e92b0" font-size="11.5" text-anchor="middle">/v1</text>

      <g transform="translate(452,72)">
        <rect width="112" height="76" rx="14" fill="#0c1728" stroke="#334868"/>
        <text x="56" y="33" fill="#cfe0f5" font-size="12.5" font-weight="600" text-anchor="middle">OpenAI</text>
        <text x="56" y="52" fill="#8ba0bd" font-size="12.5" font-weight="600" text-anchor="middle">兼容客户端</text>
      </g>
    </g>
  </g>
</svg>
