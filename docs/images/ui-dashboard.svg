<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">仪表盘界面示意</title>
  <desc id="d">智汇网关仪表盘：左侧导航，顶部平台切换，主区四个统计卡、调用趋势折线图与账号健康列表。数据为示例。</desc>
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1322"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.01"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="16" fill="url(#dbg)"/>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="none" stroke="#1c2740"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
    <!-- sidebar -->
    <rect x="0" y="0" width="216" height="720" fill="#080f1b"/>
    <line x1="216" y1="0" x2="216" y2="720" stroke="#18233a"/>
    <g transform="translate(24,26)">
      <rect width="30" height="30" rx="8" fill="#0f1d33" stroke="#22c55e" stroke-opacity="0.55"/>
      <path d="M9 20 L15 10 L21 20 M12 17.5 h6" fill="none" stroke="#22c55e" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="66" y="47" fill="#e8eefb" font-size="14" font-weight="700">智汇网关</text>

    <g font-size="12.5" fill="#7f95b4">
      <rect x="12" y="86" width="192" height="34" rx="8" fill="#12203a"/>
      <rect x="12" y="86" width="3" height="34" rx="1.5" fill="#22c55e"/>
      <text x="30" y="108" fill="#dff6e6" font-weight="600">仪表盘</text>

      <text x="30" y="152">账号管理</text>
      <text x="30" y="186">任务记录</text>
      <text x="30" y="220">API 密钥</text>
      <text x="30" y="254">请求日志</text>
      <text x="30" y="288">用量统计</text>
      <text x="30" y="322">模型中心</text>
      <text x="30" y="356">聊天测试台</text>

      <line x1="24" y1="382" x2="192" y2="382" stroke="#18233a"/>
      <text x="30" y="410">安全与 IP 管控</text>
      <text x="30" y="444">设置</text>
    </g>
    <rect x="12" y="656" width="192" height="44" rx="9" fill="#0d1728" stroke="#18233a"/>
    <circle cx="34" cy="678" r="11" fill="#1c3050"/>
    <text x="54" y="683" fill="#9fb3cf" font-size="12">admin</text>

    <!-- topbar -->
    <rect x="216" y="0" width="984" height="66" fill="#0a1220"/>
    <line x1="216" y1="66" x2="1200" y2="66" stroke="#18233a"/>
    <text x="244" y="40" fill="#e8eefb" font-size="16" font-weight="700">仪表盘</text>
    <text x="330" y="40" fill="#5d7a99" font-size="11.5">账号健康度 · 上游状态 · 近 14 天调用</text>

    <!-- platform switch -->
    <g transform="translate(830,19)">
      <rect width="250" height="30" rx="15" fill="#0d1728" stroke="#1c2b45"/>
      <rect x="3" y="3" width="82" height="24" rx="12" fill="#16233c"/>
      <text x="44" y="19" fill="#cfe0f5" font-size="11" font-weight="600" text-anchor="middle">WorkBuddy</text>
      <text x="128" y="19" fill="#6d87a6" font-size="11" text-anchor="middle">Qoder</text>
      <text x="208" y="19" fill="#6d87a6" font-size="11" text-anchor="middle">Trae</text>
    </g>

    <!-- stat cards -->
    <g>
      <rect x="244" y="92" width="214" height="96" rx="12" fill="#0d1728" stroke="#1c2b45"/>
      <text x="266" y="120" fill="#7f95b4" font-size="11.5">账号总数</text>
      <text x="266" y="154" fill="#f2f6fd" font-size="27" font-weight="700">32</text>
      <text x="322" y="154" fill="#4f6a8a" font-size="12">个</text>
      <text x="266" y="174" fill="#2ea86a" font-size="11">健康 29 · 冷却 2 · 过期 1</text>

      <rect x="470" y="92" width="214" height="96" rx="12" fill="#0d1728" stroke="#1c2b45"/>
      <text x="492" y="120" fill="#7f95b4" font-size="11.5">今日调用</text>
      <text x="492" y="154" fill="#f2f6fd" font-size="27" font-weight="700">7,383</text>
      <text x="492" y="174" fill="#5d7a99" font-size="11">较昨日 <tspan fill="#2ea86a">+12.4%</tspan></text>

      <rect x="696" y="92" width="214" height="96" rx="12" fill="#0d1728" stroke="#1c2b45"/>
      <text x="718" y="120" fill="#7f95b4" font-size="11.5">提示词缓存命中</text>
      <text x="718" y="154" fill="#f2f6fd" font-size="27" font-weight="700">98.1</text>
      <text x="774" y="154" fill="#4f6a8a" font-size="13">%</text>
      <text x="718" y="174" fill="#5d7a99" font-size="11">加权命中率 · 实时</text>

      <rect x="922" y="92" width="230" height="96" rx="12" fill="#0d1728" stroke="#1c2b45"/>
      <text x="944" y="120" fill="#7f95b4" font-size="11.5">上游引擎</text>
      <g font-size="11">
        <circle cx="950" cy="142" r="3.5" fill="#2ea86a"/>
        <text x="962" y="146" fill="#b6c9e2">workbuddy2api</text>
        <text x="1100" y="146" fill="#5d7a99">:7863</text>
        <circle cx="950" cy="163" r="3.5" fill="#2ea86a"/>
        <text x="962" y="167" fill="#b6c9e2">qoder2 · trae</text>
        <text x="1100" y="167" fill="#5d7a99">:8799</text>
      </g>
    </g>

    <!-- chart -->
    <rect x="244" y="208" width="586" height="246" rx="12" fill="#0d1728" stroke="#1c2b45"/>
    <text x="266" y="236" fill="#cfe0f5" font-size="12.5" font-weight="600">近 14 天调用量</text>
    <text x="808" y="236" fill="#5d7a99" font-size="11" text-anchor="end">token · 请求数</text>

    <!-- grid lines -->
    <g stroke="#17233a" stroke-width="1">
      <line x1="276" y1="272" x2="800" y2="272"/>
      <line x1="276" y1="316" x2="800" y2="316"/>
      <line x1="276" y1="360" x2="800" y2="360"/>
      <line x1="276" y1="404" x2="800" y2="404"/>
    </g>
    <g font-size="10" fill="#43597a" text-anchor="end">
      <text x="268" y="275">900</text>
      <text x="268" y="319">600</text>
      <text x="268" y="363">300</text>
      <text x="268" y="407">0</text>
    </g>

    <!-- area + line -->
    <path d="M300 372 L340 356 L380 364 L420 340 L460 348 L500 312 L540 324 L580 292 L620 300 L660 268 L700 282 L740 254 L780 266 L800 258 L800 404 L300 404 Z"
          fill="url(#area)"/>
    <polyline points="300,372 340,356 380,364 420,340 460,348 500,312 540,324 580,292 620,300 660,268 700,282 740,254 780,266 800,258"
              fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#22c55e">
      <circle cx="800" cy="258" r="4"/>
    </g>
    <g font-size="10" fill="#43597a" text-anchor="middle">
      <text x="300" y="428">10-14</text>
      <text x="420" y="428">10-17</text>
      <text x="540" y="428">10-20</text>
      <text x="660" y="428">10-23</text>
      <text x="780" y="428">10-27</text>
    </g>

    <!-- account health list -->
    <rect x="850" y="208" width="302" height="246" rx="12" fill="#0d1728" stroke="#1c2b45"/>
    <text x="872" y="236" fill="#cfe0f5" font-size="12.5" font-weight="600">账号 Token 有效期</text>
    <g font-size="11.5">
      <g>
        <text x="872" y="266" fill="#b6c9e2">账号 甲</text>
        <rect x="960" y="256" width="120" height="6" rx="3" fill="#16233c"/>
        <rect x="960" y="256" width="112" height="6" rx="3" fill="#2ea86a"/>
        <text x="1128" y="266" fill="#2ea86a" text-anchor="end">健康</text>
      </g>
      <g>
        <text x="872" y="296" fill="#b6c9e2">账号 乙</text>
        <rect x="960" y="286" width="120" height="6" rx="3" fill="#16233c"/>
        <rect x="960" y="286" width="86" height="6" rx="3" fill="#2ea86a"/>
        <text x="1128" y="296" fill="#2ea86a" text-anchor="end">健康</text>
      </g>
      <g>
        <text x="872" y="326" fill="#b6c9e2">账号 丙</text>
        <rect x="960" y="316" width="120" height="6" rx="3" fill="#16233c"/>
        <rect x="960" y="316" width="44" height="6" rx="3" fill="#f59e0b"/>
        <text x="1128" y="326" fill="#f59e0b" text-anchor="end">偏紧</text>
      </g>
      <g>
        <text x="872" y="356" fill="#b6c9e2">账号 丁</text>
        <rect x="960" y="346" width="120" height="6" rx="3" fill="#16233c"/>
        <rect x="960" y="346" width="22" height="6" rx="3" fill="#ef4444"/>
        <text x="1128" y="356" fill="#ef4444" text-anchor="end">即将过期</text>
      </g>
      <g>
        <text x="872" y="386" fill="#b6c9e2">账号 戊</text>
        <rect x="960" y="376" width="120" height="6" rx="3" fill="#16233c"/>
        <rect x="960" y="376" width="70" height="6" rx="3" fill="#2ea86a"/>
        <text x="1128" y="386" fill="#2ea86a" text-anchor="end">健康</text>
      </g>
    </g>
    <text x="872" y="424" fill="#43597a" font-size="10">按剩余时间分档着色</text>

    <!-- bottom: recent calls -->
    <rect x="244" y="474" width="908" height="196" rx="12" fill="#0d1728" stroke="#1c2b45"/>
    <text x="266" y="502" fill="#cfe0f5" font-size="12.5" font-weight="600">最近调用</text>
    <line x1="244" y1="516" x2="1152" y2="516" stroke="#18233a"/>
    <g font-size="11" fill="#5d7a99">
      <text x="266" y="538">时间</text>
      <text x="368" y="538">模型</text>
      <text x="556" y="538">状态</text>
      <text x="624" y="538">账号</text>
      <text x="820" y="538">首字 / 总耗时</text>
      <text x="1000" y="538">Token</text>
    </g>
    <g font-size="11.5">
      <g fill="#b6c9e2">
        <text x="266" y="566">18:12:41</text><text x="368" y="566">deepseek-v4.1-flash</text>
        <text x="556" y="566" fill="#2ea86a">200</text><text x="624" y="566">账号 甲</text>
        <text x="820" y="566">1.53s / 6.4s</text><text x="1000" y="566">1,290</text>
      </g>
      <g fill="#b6c9e2">
        <text x="266" y="594">18:12:22</text><text x="368" y="594">deepseek-v4.1-flash</text>
        <text x="556" y="594" fill="#2ea86a">200</text><text x="624" y="594">账号 乙</text>
        <text x="820" y="594">1.31s / 6.6s</text><text x="1000" y="594">1,059</text>
      </g>
      <g fill="#b6c9e2">
        <text x="266" y="622">18:12:07</text><text x="368" y="622">deepseek-v4.1-flash</text>
        <text x="556" y="622" fill="#2ea86a">200</text><text x="624" y="622">账号 丙</text>
        <text x="820" y="622">1.78s / 4.1s</text><text x="1000" y="622">531</text>
      </g>
      <g fill="#b6c9e2">
        <text x="266" y="650">18:11:55</text><text x="368" y="650">deepseek-v4.1-pro</text>
        <text x="556" y="650" fill="#2ea86a">200</text><text x="624" y="650">账号 甲</text>
        <text x="820" y="650">2.04s / 8.2s</text><text x="1000" y="650">1,449</text>
      </g>
    </g>

    <text x="1152" y="706" fill="#33465f" font-size="10" text-anchor="end">布局示意 · 数据为示例</text>
  </g>
</svg>
