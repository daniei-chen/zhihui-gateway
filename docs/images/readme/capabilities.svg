<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="284" viewBox="0 0 1280 284" role="img" aria-labelledby="title desc">
<title id="title">接入、授权、核对</title><desc id="desc">三平台路由，保持独立路由与权限；展示缓存命中和输出速度，不把缺失用量当作零。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ebeff"/><stop offset=".58" stop-color="#6c8df6"/><stop offset="1" stop-color="#5472eb"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#dceaff" stop-opacity=".95"/><stop offset="1" stop-color="#eaf3ff" stop-opacity="0"/></radialGradient>
</defs>
<style>@media(prefers-reduced-motion:reduce){.travel{display:none}}</style>
<rect x="1" y="1" width="414" height="282" rx="24" fill="url(#paper)" stroke="#dce6fc"/><g transform="translate(34 48)"><path d="M0 3 H21 Q29 3 36 14 L53 36" fill="none" stroke="#a9c0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 36 H53" fill="none" stroke="#a9c0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 69 H21 Q29 69 36 58 L53 36" fill="none" stroke="#a9c0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="55" y="18" width="38" height="36" rx="12" fill="#edf3ff" stroke="#dce6fc"/><g transform="translate(65 29) scale(0.4)"><path d="M0 0 H40 L0 33 H40" fill="none" stroke="url(#blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="0" cy="3" r="3" fill="#627ff5"/><circle cx="0" cy="36" r="3" fill="#627ff5"/><circle cx="0" cy="69" r="3" fill="#627ff5"/></g><text x="31" y="156" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" font-weight="400" letter-spacing="1.7">01 / CONNECT</text><text x="31" y="193" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="700" >一处接入</text><text x="31" y="226" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="400" >三种入口，独立路由。</text><text x="31" y="253" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="400" >WorkBuddy / Qoder / Trae。</text><rect x="433" y="1" width="414" height="282" rx="24" fill="url(#paper)" stroke="#dce6fc"/><g transform="translate(490 46)"><path d="M17 4 L44 14 V35 Q44 57 17 70 Q-10 57 -10 35 V14 Z" fill="none" stroke="#a9c0fb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M5 35 L14 44 L30 26" fill="none" stroke="#627ff5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="463" y="156" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" font-weight="400" letter-spacing="1.7">02 / AUTHORIZE</text><text x="463" y="193" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="700" >边界清楚</text><text x="463" y="226" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="400" >凭证、模型与 IP 策略。</text><text x="463" y="253" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="400" >按需授权，不混淆身份。</text><rect x="865" y="1" width="414" height="282" rx="24" fill="url(#paper)" stroke="#dce6fc"/><g transform="translate(902 47)"><rect x="0" y="2" width="77" height="73" rx="14" fill="#f5f8ff" stroke="#dce6fc"/><path d="M16 23 H58 M16 38 H41 M16 53 H48" fill="none" stroke="#9eb7f4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="59" cy="53" r="4" fill="#5aaec0"/></g><text x="895" y="156" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" font-weight="400" letter-spacing="1.7">03 / OBSERVE</text><text x="895" y="193" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="700" >消耗有据</text><text x="895" y="226" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="400" >缓存命中与输出速度。</text><text x="895" y="253" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="400" >用量缺失，不冒充零消耗。</text>
</svg>
