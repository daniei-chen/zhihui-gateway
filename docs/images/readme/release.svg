<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="368" viewBox="0 0 1280 368" role="img" aria-labelledby="title desc">
<title id="title">智汇 0.0.8 发布与验收</title><desc id="desc">客户端兼容、流式与容量、准确诊断。具体构建的测试与部署分别留证，不把历史数字当本轮验收。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ebeff"/><stop offset=".58" stop-color="#6c8df6"/><stop offset="1" stop-color="#5472eb"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#dceaff" stop-opacity=".95"/><stop offset="1" stop-color="#eaf3ff" stop-opacity="0"/></radialGradient>
</defs>
<style>@media(prefers-reduced-motion:reduce){.travel{display:none}}</style>
<rect x="1" y="1" width="1278" height="366" rx="28" fill="url(#paper)" stroke="#dce6fc"/><text x="36" y="44" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">0.0.8 / RELEASE NOTES</text><text x="36" y="88" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="33" font-weight="700" >自用，更稳一点。</text><rect x="1011" y="29" width="231" height="34" rx="17" fill="#eff8f5" stroke="#cee8dc"/><circle cx="1031" cy="46" r="3" fill="#29896a"/><text x="1043" y="51" fill="#36745f" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="600" >2026.11.05 / 固定构建</text><rect x="36" y="126" width="382" height="130" rx="18" fill="#ffffff" stroke="#e0e8f5"/><text x="58" y="158" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" letter-spacing="1">01</text><text x="101" y="163" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="600" >客户端兼容</text><text x="101" y="202" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" font-weight="400" >Codex / Claude / DSH · 11 规则</text><text x="101" y="231" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" font-weight="400" >只处理系统与开发者文本</text><rect x="450" y="126" width="382" height="130" rx="18" fill="#ffffff" stroke="#e0e8f5"/><text x="472" y="158" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" letter-spacing="1">02</text><text x="515" y="163" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="600" >链路更稳</text><text x="515" y="202" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" font-weight="400" >共享发送预算与流式闭环</text><text x="515" y="231" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" font-weight="400" >及时取消，不盲目重放</text><rect x="864" y="126" width="382" height="130" rx="18" fill="#ffffff" stroke="#e0e8f5"/><text x="886" y="158" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" letter-spacing="1">03</text><text x="929" y="163" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="600" >页面更轻</text><text x="929" y="202" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" font-weight="400" >结构共享与按需查积分</text><text x="929" y="231" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" font-weight="400" >固定错误族，证据可核对</text><path d="M36 292 H1244" fill="none" stroke="#dce6fc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="36" y="334" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="25" font-weight="700" >完整门禁</text><text x="141" y="333" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="400" >零失败才可切换</text><text x="431" y="334" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="25" font-weight="700" >来源绑定</text><text x="536" y="333" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="400" >核验源码与制品</text><text x="826" y="334" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="25" font-weight="700" >保留</text><text x="931" y="333" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="400" >业务账本不回退</text>
</svg>
