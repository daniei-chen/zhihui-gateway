<svg xmlns="http://www.w3.org/2000/svg" width="640" height="786" viewBox="0 0 640 786" role="img" aria-labelledby="title desc">
<title id="title">智汇 0.0.10 发布与验收</title><desc id="desc">客户端兼容、流式与容量、准确诊断。具体构建的测试与部署分别留证，不把历史数字当本轮验收。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ebeff"/><stop offset=".58" stop-color="#6c8df6"/><stop offset="1" stop-color="#5472eb"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#dceaff" stop-opacity=".95"/><stop offset="1" stop-color="#eaf3ff" stop-opacity="0"/></radialGradient>
</defs>
<style>@media(prefers-reduced-motion:reduce){.travel{display:none}}</style>
<rect x="1" y="1" width="638" height="784" rx="28" fill="url(#paper)" stroke="#dce6fc"/><text x="36" y="44" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">0.0.10 / RELEASE NOTES</text><text x="36" y="88" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="700" >自用，更稳一点。</text><rect x="36" y="125" width="568" height="146" rx="18" fill="#ffffff" stroke="#e0e8f5"/><text x="58" y="157" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" letter-spacing="1">01</text><text x="101" y="162" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="28" font-weight="600" >客户端兼容</text><text x="101" y="201" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" >Codex / Claude / DSH · 11 规则</text><text x="101" y="230" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" >只处理系统与开发者文本</text><rect x="36" y="291" width="568" height="146" rx="18" fill="#ffffff" stroke="#e0e8f5"/><text x="58" y="323" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" letter-spacing="1">02</text><text x="101" y="328" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="28" font-weight="600" >链路更稳</text><text x="101" y="367" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" >共享发送预算与流式闭环</text><text x="101" y="396" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" >及时取消，不盲目重放</text><rect x="36" y="457" width="568" height="146" rx="18" fill="#ffffff" stroke="#e0e8f5"/><text x="58" y="489" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" letter-spacing="1">03</text><text x="101" y="494" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="28" font-weight="600" >页面更轻</text><text x="101" y="533" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" >结构共享与按需查积分</text><text x="101" y="562" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" >固定错误族，证据可核对</text><path d="M36 659 H604" fill="none" stroke="#dce6fc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="36" y="701" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="700" >完整门禁</text><text x="36" y="729" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" >零失败才可切换</text><text x="237" y="701" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="700" >来源绑定</text><text x="237" y="729" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" >核验源码与制品</text><text x="438" y="701" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="700" >保留</text><text x="438" y="729" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" >业务账本不回退</text>
</svg>
