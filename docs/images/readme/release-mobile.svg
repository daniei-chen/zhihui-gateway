icrosoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" >及时取消，不盲目重放</text><rect x="36" y="457" width="568" height="146" rx="18" fill="#ffffff" stroke="#e0e8f5"/><text x="58" y="489" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" letter-spacing="1">03</text><text x="101" y="494" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="28" font-weight="600" >诊断有据</text><text x="101" y="533" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" >真实状态与规则命中</text><text x="101" y="562" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" font-weight="400" >有界指标与上下文来源</text><path d="M36 659 H604" fill="none" stroke="#dce6fc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="36" y="701" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="700" >4,322</text><text x="36" y="729" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" >Manager通过</text><text x="237" y="701" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="700" >1,730</text><text x="237" y="729" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="400" >引擎通过</text><text x="438" y="701" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="30" font-weight="700" >29</text><text x="438" y="729" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC'