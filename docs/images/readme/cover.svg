<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<title id="title">智汇网关 · 多源汇入，一核择路</title><desc id="desc">蓝白品牌封面。WorkBuddy、Qoder、Trae 汇入同一枚蓝色 Z。让每次调用，都走对路径。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
