7" y="380" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="400" >Trae</text><path d="M59 439 H1221" fill="none" stroke="#dce6fc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="59" y="467" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="400" >三平台接入   /   独立授权   /   用量有据</text><text x="1221" y="467" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" font-weight="400" text-anchor="end" letter-spacing="1.5">LESS NOISE. MORE CONTROL.</text>
