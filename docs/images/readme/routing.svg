<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="384" viewBox="0 0 1280 384" role="img" aria-labelledby="title desc">
<title id="title">客户端、智汇与三平台路由</title><desc id="desc">你的客户端经智汇鉴权、路由及计量后访问平台。WorkBuddy 使用 /v1/*，Qoder 使用 /qoder/v1/*，Trae 使用 /trae/v1/*。切换管理视图不会更改客户端地址。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ebeff"/><stop offset=".58" stop-color="#6c8df6"/><stop offset="1" stop-color="#5472eb"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#dceaff" stop-opacity=".95"/><stop offset="1" stop-color="#eaf3ff" stop-opacity="0"/></radialGradient>
</defs>
<style>@media(prefers-reduced-motion:reduce){.travel{display:none}}</style>
<rect x="1" y="1" width="1278" height="382" rx="26" fill="url(#paper)" stroke="#dce6fc"/><text x="38" y="43" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="400" letter-spacing="1.8">ONE ENTRY. DISTINCT ROUTES.</text><rect x="42" y="145" width="239" height="103" rx="22" fill="#ffffff" stroke="#dce6fc"/><text x="161" y="186" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="23" font-weight="700" text-anchor="middle">你的客户端</text><text x="161" y="217" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="400" text-anchor="middle">授权 Key · 模型 · 协议</text><path d="M281 197 H432" fill="none" stroke="#adc5fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M281 197 H432"/></circle><rect x="432" y="129" width="303" height="137" rx="26" fill="#edf3ff" stroke="#dce6fc"/><g transform="translate(466 174) scale(0.9)"><path d="M0 0 H40 L0 33 H40" fill="none" stroke="url(#blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="526" y="186" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="27" font-weight="700" >智汇网关</text><text x="526" y="219" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="400" >鉴权 / 路由 / 计量</text><path d="M735 197 C795 197 797 113 861 113" fill="none" stroke="#bfd0f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-0s" repeatCount="indefinite" path="M735 197 C795 197 797 113 861 113"/></circle><rect x="861" y="83" width="374" height="60" rx="18" fill="#ffffff" stroke="#dce6fc"/><circle cx="884" cy="113" r="3" fill="#627ff5"/><text x="901" y="109" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" >WorkBuddy</text><text x="1214" y="122" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="400" text-anchor="end">/v1/*</text><path d="M735 197 C795 197 797 195 861 195" fill="none" stroke="#bfd0f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-2s" repeatCount="indefinite" path="M735 197 C795 197 797 195 861 195"/></circle><rect x="861" y="165" width="374" height="60" rx="18" fill="#ffffff" stroke="#dce6fc"/><circle cx="884" cy="195" r="3" fill="#627ff5"/><text x="901" y="191" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" >Qoder</text><text x="1214" y="204" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="400" text-anchor="end">/qoder/v1/*</text><path d="M735 197 C795 197 797 277 861 277" fill="none" stroke="#bfd0f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /><circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-4s" repeatCount="indefinite" path="M735 197 C795 197 797 277 861 277"/></circle><rect x="861" y="247" width="374" height="60" rx="18" fill="#ffffff" stroke="#dce6fc"/><circle cx="884" cy="277" r="3" fill="#627ff5"/><text x="901" y="273" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="600" >Trae</text><text x="1214" y="286" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="400" text-anchor="end">/trae/v1/*</text><path d="M38 332 H1242" fill="none" stroke="#dce6fc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="38" y="360" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="400" >管理视图 ≠ 客户端地址</text><text x="1242" y="360" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="400" text-anchor="end">协议能力以对应引擎及账号授权为准。</text>
</svg>
