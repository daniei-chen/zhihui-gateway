<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
<title id="title">客户端、智汇与 WorkBuddy 路由</title><desc id="desc">WorkBuddy 使用 /v1/*。切换管理视图不会更改客户端地址。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ebeff"/><stop offset=".58" stop-color="#6c8df6"/><stop offset="1" stop-color="#5472eb"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#dceaff" stop-opacity=".95"/><stop offset="1" stop-color="#eaf3ff" stop-opacity="0"/></radialGradient>
</defs>
<style>@media(prefers-reduced-motion:reduce){.travel{display:none}}</style>
<rect x="1" y="1" width="1278" height="448" rx="26" fill="url(#paper)" stroke="#dce6fc"/>
<text x="38" y="43" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="400" letter-spacing="1.8">ONE ENTRY. ONE ROUTE.</text>
<circle cx="640" cy="225" r="235" fill="url(#halo)"/>
<rect x="42" y="145" width="239" height="103" rx="22" fill="#ffffff" stroke="#dce6fc"/>
<text x="161" y="186" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="23" font-weight="700" text-anchor="middle">你的客户端</text>
<text x="161" y="217" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="400" text-anchor="middle">授权 Key · 模型 · 协议</text>
<path d="M281 197 H432" fill="none" stroke="#adc5fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M281 197 H432"/></circle>
<rect x="432" y="129" width="303" height="137" rx="26" fill="#edf3ff" stroke="#dce6fc"/>
<g transform="translate(466 174) scale(0.9)"><path d="M0 0 H40 L0 33 H40" fill="none" stroke="url(#blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="526" y="186" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="27" font-weight="700">智汇网关</text>
<text x="526" y="219" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="400">鉴权 / 路由 / 计量</text>
<path d="M735 197 C830 197 870 197 960 197" fill="none" stroke="#bfd0f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-0s" repeatCount="indefinite" path="M735 197 C830 197 870 197 960 197"/></circle>
<rect x="960" y="129" width="278" height="137" rx="26" fill="#ffffff" stroke="#dce6fc"/>
<text x="1099" y="181" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="26" font-weight="700" text-anchor="middle">WorkBuddy</text>
<text x="1099" y="216" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="400" text-anchor="middle">/v1/*</text>
<text x="1099" y="244" fill="#8fa2bd" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="400" text-anchor="middle">Chat · Responses · Messages</text>
<path d="M38 398 H1242" fill="none" stroke="#e6edfb" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="38" y="424" fill="#8fa2bd" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="400">客户端地址固定；管理视图的切换不影响调用入口。</text>
</svg>
