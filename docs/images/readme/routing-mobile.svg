<svg xmlns="http://www.w3.org/2000/svg" width="640" height="794" viewBox="0 0 640 794" role="img" aria-labelledby="title desc">
<title id="title">客户端、智汇与三平台路由</title><desc id="desc">你的客户端经智汇鉴权、路由及计量后访问平台。WorkBuddy 使用 /v1/*，Qoder 使用 /qoder/v1/*，Trae 使用 /trae/v1/*。切换管理视图不会更改客户端地址。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ebeff"/><stop offset=".58" stop-color="#6c8df6"/><stop offset="1" stop-color="#5472eb"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#dceaff" stop-opacity=".95"/><stop offset="1" stop-color="#eaf3ff" stop-opacity="0"/></radialGradient>
</defs>
<style>@media(prefers-reduced-motion:reduce){.travel{display:none}}</style>
<rect x="1" y="1" width="638" height="792" rx="26" fill="url(#paper)" stroke="#dce6fc"/><text x="34" y="40" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="400" letter-spacing="1.6">ONE ENTRY. DISTINCT ROUTES.</text><rect x="171" y="71" width="296" height="69" rx="20" fill="#ffffff" stroke="#dce6fc"/><text x="319" y="99" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="20" font-weight="700" text-anchor="middle">你的客户端</text><text x="319" y="122" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="400" text-anchor="middle">授权 Key · 模型 · 协议</text><path d="M319 140 V190" fill="none" stroke="#b8ccfb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-2s" repeatCount="indefinite" path="M319 140 V190"/></circle><rect x="171" y="190" width="296" height="103" rx="24" fill="#edf3ff" stroke="#dce6fc"/><g transform="translate(202 225) scale(0.75)"><path d="M0 0 H40 L0 33 H40" fill="none" stroke="url(#blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="254" y="233" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="23" font-weight="700" >智汇网关</text><text x="254" y="259" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="400" >鉴权 / 路由 / 计量</text><path d="M319 293 V323 H75 V623" fill="none" stroke="#c9d8fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><path d="M75 391 H136" fill="none" stroke="#b7ccfc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-0s" repeatCount="indefinite" path="M75 391 H136"/></circle><circle cx="75" cy="391" r="3" fill="#627ff5"/><rect x="136" y="347" width="402" height="88" rx="20" fill="#ffffff" stroke="#dce6fc"/><text x="161" y="380" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="600" >WorkBuddy</text><text x="161" y="408" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="400" >/v1/*</text><path d="M75 501 H136" fill="none" stroke="#b7ccfc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-2s" repeatCount="indefinite" path="M75 501 H136"/></circle><circle cx="75" cy="501" r="3" fill="#627ff5"/><rect x="136" y="457" width="402" height="88" rx="20" fill="#ffffff" stroke="#dce6fc"/><text x="161" y="490" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="600" >Qoder</text><text x="161" y="518" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="400" >/qoder/v1/*</text><path d="M75 611 H136" fill="none" stroke="#b7ccfc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><circle class="travel" r="3" fill="#627ff5" opacity=".8"><animateMotion dur="9s" begin="-4s" repeatCount="indefinite" path="M75 611 H136"/></circle><circle cx="75" cy="611" r="3" fill="#627ff5"/><rect x="136" y="567" width="402" height="88" rx="20" fill="#ffffff" stroke="#dce6fc"/><text x="161" y="600" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="600" >Trae</text><text x="161" y="628" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="400" >/trae/v1/*</text><path d="M34 700 H606" fill="none" stroke="#dce6fc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="34" y="734" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" font-weight="600" >管理视图 ≠ 客户端地址</text><text x="34" y="762" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="400" >协议能力以对应引擎及账号授权为准。</text>
</svg>
