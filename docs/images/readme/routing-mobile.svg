<svg xmlns="http://www.w3.org/2000/svg" width="640" height="904" viewBox="0 0 640 904" role="img" aria-labelledby="title desc">
<title id="title">客户端、智汇与 WorkBuddy 路由</title><desc id="desc">WorkBuddy 使用 /v1/*。切换管理视图不会更改客户端地址。</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ebeff"/><stop offset=".58" stop-color="#6c8df6"/><stop offset="1" stop-color="#5472eb"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#dceaff" stop-opacity=".95"/><stop offset="1" stop-color="#eaf3ff" stop-opacity="0"/></radialGradient>
</defs>
<style>@media(prefers-reduced-motion:reduce){.travel{display:none}}</style>
<rect x="1" y="1" width="638" height="902" rx="26" fill="url(#paper)" stroke="#dce6fc"/>
<text x="34" y="56" fill="#627ff5" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="400" letter-spacing="1.8">ONE ENTRY. ONE ROUTE.</text>
<circle cx="320" cy="450" r="300" fill="url(#halo)"/>
<rect x="70" y="120" width="500" height="128" rx="26" fill="#ffffff" stroke="#dce6fc"/>
<text x="320" y="176" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="27" font-weight="700" text-anchor="middle">你的客户端</text>
<text x="320" y="212" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="400" text-anchor="middle">授权 Key · 模型 · 协议</text>
<path d="M320 248 V330" fill="none" stroke="#adc5fb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="travel" r="3.2" fill="#627ff5" opacity=".8"><animateMotion dur="8s" begin="-2s" repeatCount="indefinite" path="M320 248 V330"/></circle>
<rect x="70" y="330" width="500" height="165" rx="28" fill="#edf3ff" stroke="#dce6fc"/>
<g transform="translate(140 388) scale(1.15)"><path d="M0 0 H40 L0 33 H40" fill="none" stroke="url(#blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="196" y="404" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="31" font-weight="700">智汇网关</text>
<text x="196" y="442" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="400">鉴权 / 路由 / 计量</text>
<path d="M320 495 V575" fill="none" stroke="#bfd0f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="travel" r="3.2" fill="#627ff5" opacity=".8"><animateMotion dur="8s" begin="-0s" repeatCount="indefinite" path="M320 495 V575"/></circle>
<rect x="70" y="575" width="500" height="152" rx="26" fill="#ffffff" stroke="#dce6fc"/>
<text x="320" y="630" fill="#202c42" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="29" font-weight="700" text-anchor="middle">WorkBuddy</text>
<text x="320" y="666" fill="#62738e" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="18" font-weight="400" text-anchor="middle">/v1/*</text>
<text x="320" y="698" fill="#8fa2bd" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="400" text-anchor="middle">Chat · Responses · Messages</text>
<path d="M34 806 H606" fill="none" stroke="#e6edfb" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="34" y="842" fill="#8fa2bd" font-family="'Bahnschrift', 'DIN Alternate', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="400">客户端地址固定；管理视图的切换不影响调用入口。</text>
</svg>
