    location = /trae-callback-test {
        access_log off;
        error_log /dev/null crit;
        return 303 /trae-callback-test/;
    }
    location ^~ /trae-callback-test/ {
        access_log off;
        error_log /dev/null crit;
        limit_req zone=zh_trae_probe_rate burst=8 nodelay;
        limit_req_status 429;
        limit_conn zh_trae_probe_ip 4;
