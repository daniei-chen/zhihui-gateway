# 余额协议专用（2026-11-23）。密钥鉴权，**不需要面板会话** —— 因此不能落在
# `location /api/` 里，那段有 auth_request /__zh_session，外部面板会被
# 401 后跳登录页，永远拿不到余额。
#
# 使用方：location = /api/usage/token{/}
# 说明与注意事项见同目录 README.md。
limit_req zone=zh_api_ip_rate burst=100 nodelay;
limit_req_status 429;
access_log /var/log/nginx/workbuddy-audit.log workbuddy_audit;
proxy_pass http://zhihui_mgr;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_buffering off;
