# 推理路径走滚动中继（127.0.0.1:7867）。
#
# 中继按签名路由文件决定把新请求转发到哪个后端实例，而已经开始的流仍留在原实例
# 上 —— 于是发布时可以先起新实例、切路由、再停旧实例，在途调用不必被打断。
# 中继只接受白名单内的推理路径，其余 /v1/* 请求仍由站点里的 location /v1/ 直连。
#
# 除 proxy_pass 指向中继外，各项与 location /v1/ 保持一致；Connection "" 是必须的，
# 否则客户端带来的 Connection 头会原样传给中继，破坏它与后端之间的长连接复用。
access_log /var/log/nginx/workbuddy-audit.log workbuddy_audit;
proxy_pass $zhihui_relay_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
include /etc/nginx/snippets/zhihui-gateway-admission.location.conf;
proxy_buffering off;
