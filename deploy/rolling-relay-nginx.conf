# Include only inside the public server block after the relay has passed its
# private canary.  Keep the locations explicit: the relay is inference-only.
# Do not replace the existing /api, /metrics, panel or static locations.
location = /v1/chat/completions {
    include /etc/nginx/snippets/zhihui-gateway-admission.location.conf;
    proxy_pass http://127.0.0.1:7867;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

