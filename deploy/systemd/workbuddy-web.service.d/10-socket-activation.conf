# 让 workbuddy-web.service 使用上面的 socket（drop-in）
#
# 放在 /etc/systemd/system/workbuddy-web.service.d/10-socket-activation.conf
#
# 只加 `Sockets=`：它让 systemd 先启动 socket 单元，然后把监听 fd 交给服务
# （服务进程从 fd 3 取，见 server/serve.py 的 inherited_listener）。
#
# 刻意**不加** `Requires=workbuddy-web.socket`：万一 socket 单元起不来
# （端口被占、SELinux 之类），`Requires=` 会让服务直接拒绝启动 —— 那就是
# "装个优化补丁把服务装挂"。现在这种写法是「拿得到 fd 就用，拿不到就自己 bind」，
# 退化成装之前的行为，不会更糟。

[Unit]
Description=ZHIHUI Gateway - use systemd socket activation for 127.0.0.1:7866

[Service]
Sockets=workbuddy-web.socket
