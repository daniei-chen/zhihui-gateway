# Install as:
#   /etc/systemd/system/qoder2-engine.service.d/95-rootless-production.conf
#
# qoder-release.service/socket/activate/recover remain root-owned control-plane
# units.  Only the serving process is handed to UID 10001 by the launcher.
[Service]
User=root
Group=root
SupplementaryGroups=
WorkingDirectory=/opt/qoder-release
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=PYTHONNOUSERSITE=1
Environment=PYTHONSAFEPATH=1
Environment=PYTHONPYCACHEPREFIX=/opt/qoder-release/python-cache
Environment=ACCOUNTS_DIR=/opt/workbuddy-manager/engines/accounts
Environment=QD_PROXY_USAGE_DIR=/opt/workbuddy-manager/engines/usage
Environment=QD_LOG_DIR=/opt/workbuddy-manager/engines/logs
UnsetEnvironment=PYTHONPATH PYTHONHOME LD_PRELOAD LD_LIBRARY_PATH
ExecStartPre=
ExecStart=
ExecStart=/opt/qoder-release/bin/qoder-rootless-production.py
PrivateTmp=yes
PrivateDevices=yes
ProtectHome=yes
ProtectSystem=strict
ReadOnlyPaths=/opt/qoder-release
ReadWritePaths=/opt/workbuddy-manager/engines/accounts /opt/workbuddy-manager/engines/usage /opt/workbuddy-manager/engines/logs
InaccessiblePaths=/opt/qoder-release/keys
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
MemoryMax=512M
TasksMax=512
CapabilityBoundingSet=CAP_SETUID CAP_SETGID
AmbientCapabilities=
# The root launcher must be able to perform the one-way setpriv handoff;
# the child enforces NoNewPrivileges before application code runs.
NoNewPrivileges=no
