name: Stable image promotion

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published latest stable tag whose verified digests should become latest
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

# Serialize the shared aliases across all versions; never cancel a partial move.
concurrency:
  group: stable-image-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published Release, same-run quality and immutable digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 tools/promote_images.py --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --apply
      - name: Keep the promotion and rollback receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: promotion-report.json
          if-no-files-found: warn
          retention-days: 30
